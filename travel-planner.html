<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>十月旅行规划</title>
<!-- 本工作台通过 WorkBuddy 资料库能力（library skill）搭建、存储和部署 -->
<style>
:root{
  --primary:#7FA8D8;--primary-light:#F1F5FB;--primary-dark:#5A86C4;
  --bg:#FAFBFC;--card-bg:#FFFFFF;--text:#333C4E;--text-light:#78849B;--text-muted:#AEB7C4;
  --border:#E9EDF3;--danger:#D97C80;--danger-light:#FBEDED;--success:#5AA98C;--success-light:#EEF7F3;
  --warning:#DFAE82;--info:#7FA8D8;--radius:14px;--shadow:0 2px 8px rgba(44,54,80,.06);
  --shadow-lg:0 4px 16px rgba(44,54,80,.1);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
button{font-family:inherit;cursor:pointer;border:none;outline:none;transition:all .2s}
input,select,textarea{font-family:inherit;font-size:16px;outline:none;border:none}
input[type="date"]::-webkit-calendar-picker-indicator{cursor:pointer}

/* Header */
.app-header{background:linear-gradient(135deg,#7E9FDC,#9A94C9);color:#fff;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(127,168,216,.25)}
.app-header h1{font-size:20px;font-weight:700;display:flex;align-items:center;gap:8px}
.header-actions{display:flex;align-items:center;gap:8px}
.sync-badge{display:flex;align-items:center;gap:5px;font-size:12px;background:rgba(255,255,255,.2);padding:4px 10px;border-radius:20px;white-space:nowrap}
.sync-badge.offline{background:rgba(217,124,128,.25)}
.sync-badge.online{background:rgba(46,217,183,.25)}
.sync-dot{width:8px;height:8px;border-radius:50%;background:#fff;animation:pulse 2s infinite}
.sync-badge.offline .sync-dot{background:#D97C80;animation:none}
.sync-badge.online .sync-dot{background:#7FCBB8}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.icon-btn{background:rgba(255,255,255,.2);color:#fff;width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center}
.icon-btn:hover{background:rgba(255,255,255,.3)}
.icon-btn svg{width:18px;height:18px}

/* Container */
.container{max-width:960px;margin:0 auto;padding:12px 16px}

/* Today Section */
.today-section{background:var(--card-bg);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:16px}
.today-section h2{font-size:15px;font-weight:600;color:var(--text);margin-bottom:12px;display:flex;align-items:center;gap:6px}
.today-section h2 svg{width:18px;height:18px;color:var(--primary)}
.today-empty{color:var(--text-light);font-size:14px;padding:8px 0}
.today-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;margin-bottom:6px;transition:background .2s}
.today-item:last-child{margin-bottom:0}
.today-item.overdue{background:var(--danger-light);border-left:3px solid var(--danger)}
.today-item.today{background:var(--primary-light);border-left:3px solid var(--primary)}
.today-item.upcoming{background:#F1F5FB;border-left:3px solid var(--info)}
.today-item-info{flex:1;min-width:0}
.today-item-title{font-size:14px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.today-item-meta{font-size:12px;color:var(--text-light);display:flex;gap:8px;align-items:center}
.today-item-badge{font-size:11px;padding:2px 6px;border-radius:4px;white-space:nowrap}
.badge-overdue{background:#D97C80;color:#fff}
.badge-today{background:var(--primary);color:#fff}
.badge-upcoming{background:var(--info);color:#fff}
.today-action{flex-shrink:0;background:#fff;border:1px solid var(--border);border-radius:6px;padding:5px 10px;font-size:12px;color:var(--text)}
.today-action:hover{background:var(--primary);color:#fff;border-color:var(--primary)}

/* Tabs */
.tabs{display:flex;gap:0;background:var(--card-bg);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
.tab-btn{flex:1;padding:12px 8px;font-size:14px;font-weight:500;color:var(--text-light);background:transparent;display:flex;flex-direction:column;align-items:center;gap:4px;border-bottom:3px solid transparent}
.tab-btn svg{width:20px;height:20px}
.tab-btn.active{color:var(--primary);border-bottom-color:var(--primary);background:var(--primary-light)}
.tab-btn:hover:not(.active){color:var(--text)}

/* Module */
.module{display:none}
.module.active{display:block}

/* Cards */
.card{background:var(--card-bg);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:16px}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.card-title{font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px}
.card-title svg{width:20px;height:20px;color:var(--primary)}

/* Add Form */
.add-form{background:var(--card-bg);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:16px}
.add-form-header{font-size:15px;font-weight:600;color:var(--text);margin-bottom:12px;display:flex;align-items:center;gap:6px}
.add-form-header svg{width:18px;height:18px;color:var(--primary)}
.form-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.form-field{flex:1;min-width:140px}
.form-field label{display:block;font-size:12px;color:var(--text-light);margin-bottom:4px;font-weight:500}
.form-field input,.form-field select,.form-field textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:16px;background:var(--bg);color:var(--text)}
.form-field input:focus,.form-field select:focus,.form-field textarea:focus{border-color:var(--primary);background:#fff}
.form-field textarea{resize:vertical;min-height:40px}
.btn-add{background:var(--primary);color:#fff;padding:10px 20px;border-radius:8px;font-size:14px;font-weight:500;display:flex;align-items:center;gap:6px;min-height:44px}
.btn-add:hover{background:var(--primary-dark)}
.btn-add svg{width:18px;height:18px}

/* List items */
.list-item{background:var(--card-bg);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:10px;transition:box-shadow .2s}
.list-item:hover{box-shadow:var(--shadow-lg)}
.list-item-body{flex:1;min-width:0}
.list-item-title{font-size:14px;font-weight:500;color:var(--text);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.list-item-meta{font-size:12px;color:var(--text-light);display:flex;gap:10px;flex-wrap:wrap;margin-top:3px;align-items:center}
.list-item-notes{font-size:12px;color:var(--text-light);margin-top:4px;font-style:italic}
.list-item-actions{display:flex;gap:6px;flex-shrink:0}
.list-item-actions button{width:32px;height:32px;border-radius:6px;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);background:var(--bg)}
.list-item-actions button:hover{background:var(--primary-light);border-color:var(--primary)}
.list-item-actions button svg{width:16px;height:16px}
.list-item-actions .btn-delete:hover{background:var(--danger-light);border-color:var(--danger)}
.list-item-actions .btn-delete:hover svg{color:var(--danger)}
.list-item-actions .btn-delete svg{color:var(--text-light)}
.list-item-actions .btn-check:hover{background:var(--success-light);border-color:var(--success)}
.list-item-actions .btn-check svg{color:var(--text-light)}
.list-item-actions .btn-check:hover svg{color:var(--success)}
.list-item.done .list-item-title{text-decoration:line-through;color:var(--text-light)}
.list-item.done{opacity:.65}
.tag{font-size:11px;padding:2px 8px;border-radius:4px;background:var(--bg);color:var(--text-light)}
.tag-expense{background:var(--danger-light);color:var(--danger)}
.tag-income{background:var(--success-light);color:var(--success)}
.tag-transport{background:#E8F2FF;color:#5A86C4}
.tag-hotel{background:#FFE9EC;color:#D97C80}
.tag-food{background:#F1F5FB;color:#DFAE82}
.tag-ticket{background:#E6F7FB;color:#1FA8A0}
.tag-shopping{background:#EDFBF2;color:#5AA98C}
.tag-other{background:#F4F7FC;color:#78849B}
.amount-expense{color:var(--danger);font-weight:600}
.amount-income{color:var(--success);font-weight:600}
.priority-high{color:var(--danger)}
.priority-medium{color:var(--warning)}
.priority-low{color:var(--text-light)}

/* Budget Summary */
.budget-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.budget-card{background:var(--card-bg);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;text-align:center}
.budget-card .label{font-size:12px;color:var(--text-light);margin-bottom:4px}
.budget-card .value{font-size:22px;font-weight:700}
.budget-card.expense .value{color:var(--danger)}
.budget-card.income .value{color:var(--success)}
.budget-card.balance .value{color:var(--primary)}

/* Pie chart */
.chart-section{background:var(--card-bg);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:16px}
.chart-section h3{font-size:14px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.chart-section h3 svg{width:18px;height:18px;color:var(--primary)}
.pie-wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.pie-chart{flex-shrink:0}
.pie-legend{flex:1;min-width:180px}
.pie-legend-item{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:13px}
.pie-legend-dot{width:12px;height:12px;border-radius:3px;flex-shrink:0}
.pie-legend-amount{margin-left:auto;font-weight:600}

/* Destination Board */
.dest-board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.dest-column{background:var(--bg);border-radius:var(--radius);padding:10px;min-height:120px}
.dest-column h4{font-size:13px;font-weight:600;color:var(--text);margin-bottom:10px;padding-bottom:8px;border-bottom:2px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.dest-column .count{font-size:11px;color:var(--text-light);background:var(--card-bg);padding:1px 6px;border-radius:10px}
.dest-card{background:var(--card-bg);border-radius:8px;padding:10px;margin-bottom:8px;box-shadow:0 1px 3px rgba(0,0,0,.06);cursor:pointer;transition:box-shadow .2s}
.dest-card:hover{box-shadow:var(--shadow)}
.dest-card-title{font-size:13px;font-weight:600;color:var(--text);margin-bottom:4px}
.dest-card-meta{font-size:11px;color:var(--text-light)}
.dest-card-priority{display:inline-block;font-size:11px;font-weight:600;margin-right:6px}

  /* 城市图标 + 世界遗产/荣誉徽章（看板 & 行程） */
  .dest-card-icon{font-size:14px;margin-right:5px;line-height:1}
  .dest-badge{display:inline-block;font-size:10px;font-weight:700;padding:1px 7px;border-radius:10px;margin-left:6px;vertical-align:middle;color:#fff;white-space:nowrap}
  .dest-badge.wh{background:#DE9090}
  .dest-badge.memory{background:#AC9FD4}
  .dest-badge.food{background:#DFAE82}
  .dest-badge.culture{background:#7FA8D8}
  .itin-icon{font-size:14px;margin-right:2px;line-height:1}
  .itin-badge{display:inline-block;font-size:10px;font-weight:700;padding:1px 7px;border-radius:10px;margin-left:6px;color:#fff;white-space:nowrap}
  .itin-badge.wh{background:#DE9090}
  .itin-badge.memory{background:#AC9FD4}
  .itin-badge.food{background:#DFAE82}
  .itin-badge.culture{background:#7FA8D8}

  /* 必体验高亮条（与主页九城卡 .cul-do 同色系，清爽黄绿蓝） */
  .list-item-must{font-size:12px;color:#4A7CB8;background:#F1F5FB;padding:6px 10px;border-radius:8px;margin-top:7px;line-height:1.55;border-left:3px solid #D9C97E}
  .dest-card-must{font-size:11.5px;color:#4A7CB8;background:#F1F5FB;padding:5px 9px;border-radius:8px;margin-top:6px;line-height:1.5}

/* Empty state */
.empty-state{text-align:center;padding:24px 16px;color:var(--text-light)}
.empty-state svg{width:48px;height:48px;color:var(--text-muted);margin-bottom:8px}
.empty-state p{font-size:14px}

/* Backup reminder */
.backup-reminder{background:#F1F5FB;border:1px solid #FFE6A8;border-radius:var(--radius);padding:10px 14px;margin-bottom:16px;font-size:13px;color:#B36B00;display:flex;align-items:center;gap:8px}
.backup-reminder svg{width:18px;height:18px;flex-shrink:0}

/* Modal */
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:200;justify-content:center;align-items:flex-start;padding:20px;padding-top:10vh}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow-lg);width:100%;max-width:480px;max-height:80vh;overflow-y:auto}
.modal-header{padding:16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-header h3{font-size:16px;font-weight:600}
.modal-close{width:32px;height:32px;border-radius:6px;display:flex;align-items:center;justify-content:center;background:var(--bg);border:1px solid var(--border)}
.modal-close:hover{background:var(--danger-light)}
.modal-close svg{width:16px;height:16px;color:var(--text-light)}
.modal-body{padding:16px}
.modal-body .form-field{margin-bottom:12px}
.modal-footer{padding:16px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end}
.btn-save{background:var(--primary);color:#fff;padding:10px 20px;border-radius:8px;font-size:14px;font-weight:500;min-height:44px}
.btn-save:hover{background:var(--primary-dark)}
.btn-cancel{background:var(--bg);color:var(--text);padding:10px 20px;border-radius:8px;font-size:14px;border:1px solid var(--border);min-height:44px}
.btn-cancel:hover{background:var(--border)}

/* Confirm dialog */
.confirm-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:300;justify-content:center;align-items:center;padding:20px}
.confirm-overlay.show{display:flex}
.confirm-box{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow-lg);width:100%;max-width:340px;padding:24px;text-align:center}
.confirm-box h3{font-size:16px;font-weight:600;margin-bottom:8px}
.confirm-box p{font-size:14px;color:var(--text-light);margin-bottom:16px}
.confirm-box .confirm-actions{display:flex;gap:10px;justify-content:center}
.confirm-box .btn-confirm-danger{background:var(--danger);color:#fff}
.confirm-box .btn-confirm-danger:hover{background:#E03E3E}

/* ===== Overview 行程总览 ===== */
.overview{background:var(--card-bg);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:16px}
.overview h2{font-size:15px;font-weight:600;color:var(--text);margin-bottom:12px;display:flex;align-items:center;gap:6px}
.overview h2 svg{width:18px;height:18px;color:var(--primary)}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.stat-card{background:var(--bg);border-radius:8px;padding:9px 4px;text-align:center}
.stat-value{font-size:18px;font-weight:700;color:var(--primary);line-height:1.3;white-space:nowrap}
.stat-value small{font-size:11px;font-weight:600}
.stat-label{font-size:11px;color:var(--text-light)}
.route-scroll{overflow-x:auto;padding:6px 2px 8px;-webkit-overflow-scrolling:touch}
.route-map{display:flex;align-items:flex-start;min-width:max-content}
.route-stop{width:68px;flex-shrink:0;display:flex;flex-direction:column;align-items:center}
.route-dot{width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--primary);flex-shrink:0}
.route-stop.daytrip .route-dot{border-color:var(--info)}
.route-stop.home .route-dot{background:var(--primary)}
.route-city{font-size:12px;font-weight:600;color:var(--text);margin-top:5px;white-space:nowrap}
.route-dates{font-size:10px;color:var(--text-light);white-space:nowrap;margin-top:1px}
.route-nights{font-size:10px;color:var(--primary);font-weight:600;white-space:nowrap}
.route-seg{width:44px;flex-shrink:0;display:flex;flex-direction:column;align-items:center}
.seg-line{width:100%;border-top:2px dashed var(--text-muted);margin-top:8px}
.seg-icon{display:flex;background:var(--card-bg);padding:0 2px;margin-top:-9px}
.seg-icon svg{width:14px;height:14px}
.seg-icon.plane{color:var(--info)}
.seg-icon.train{color:var(--success)}
.seg-date{font-size:9px;color:var(--text-light);margin-top:2px;white-space:nowrap}
.route-legend{display:flex;gap:14px;margin-top:6px;padding-top:8px;border-top:1px dashed var(--border);font-size:11px;color:var(--text-light)}
.route-legend span{display:flex;align-items:center;gap:4px}
.route-legend svg{width:13px;height:13px}
.legend-plane{color:var(--info)}
.legend-train{color:var(--success)}
.overview-todos{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}

.ot-label{font-size:11px;color:var(--text-light);font-weight:600}
.todo-chip{font-size:11px;background:#F1F5FB;color:#B36B00;border:1px solid #FFE6A8;padding:3px 9px;border-radius:12px;white-space:nowrap}

/* Responsive */
body{-webkit-tap-highlight-color:transparent}
@media(max-width:768px){
  .stats-row{grid-template-columns:repeat(2,1fr)}
  .app-header{padding:12px 14px}
  .app-header h1{font-size:17px}
  .container{padding:10px 12px}
  .tabs{position:sticky;top:0;z-index:60;border-radius:0 0 var(--radius) var(--radius)}
  .route-scroll::after{content:"← 左右滑动查看全程路线 →";display:block;text-align:center;font-size:11px;color:var(--text-light);padding-top:4px}
  .list-item{padding:12px;gap:8px}
  .list-item-actions button{width:38px;height:38px}
  .modal-close{width:38px;height:38px}
  .budget-summary{grid-template-columns:1fr 1fr 1fr;gap:8px}
  .budget-card .value{font-size:18px}
  .dest-board{grid-template-columns:1fr 1fr}
  .form-row{flex-direction:column}
  .form-field{min-width:100%}
  .list-item{flex-wrap:wrap}
  .tab-btn{font-size:12px;padding:10px 4px}
  .tab-btn span{font-size:11px}
  .pie-wrap{flex-direction:column;align-items:center}
}
@media(max-width:480px){
  .budget-summary{grid-template-columns:1fr}
  .dest-board{grid-template-columns:1fr}
  .app-header h1{font-size:15px}
  .header-actions{gap:4px}
  .sync-badge{font-size:11px;padding:3px 6px}
}

/* Scrollbar */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--text-muted);border-radius:3px}

/* Backup Route 备选路线 */
.backup-wrap{background:var(--card-bg);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:16px}
.backup-title{font-size:16px;font-weight:700;color:var(--text);margin-bottom:4px}
.backup-sub{font-size:12px;color:var(--text-light);margin-bottom:12px}
.backup-note{font-size:12px;color:#B36B00;background:#F1F5FB;border:1px dashed #FFE066;padding:8px 12px;border-radius:8px;margin-bottom:16px;line-height:1.5}
.route-flow{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin-bottom:18px;padding:12px;background:#FAF7FF;border-radius:10px}
.rf-node{padding:6px 11px;border-radius:18px;background:#fff;border:1px solid #E4EAF4;font-size:12.5px;font-weight:500;color:#333C4E;white-space:nowrap}
.rf-node.start{background:#DFAE82;color:#fff;border-color:#DFAE82}
.rf-node.end{background:#7FCBB8;color:#fff;border-color:#7FCBB8}
.rf-arrow{color:#AEB7C4;font-size:13px}
.dir-cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.dir-card{border:1px solid #E4EAF4;border-radius:12px;padding:14px;background:#fff;position:relative}
.dir-card.recommended{border:2px solid #DFAE82;box-shadow:0 4px 14px rgba(223,174,130,.2)}
.dir-card h3{font-size:15px;margin-bottom:8px;display:flex;align-items:center;gap:6px;color:var(--text)}
.dir-tag{font-size:11px;padding:2px 8px;border-radius:10px;background:#DFAE82;color:#fff;font-weight:600}
.dir-card ul{list-style:none;font-size:12.5px;color:#5C6779;line-height:1.75;padding:0;margin:0}
.dir-card li{margin-bottom:3px}
.dir-card li:before{content:"·";color:#DFAE82;font-weight:700;margin-right:6px}
.cmp-table{width:100%;border-collapse:collapse;font-size:12.5px;margin-bottom:16px;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.cmp-table th,.cmp-table td{padding:9px 11px;text-align:left;border-bottom:1px solid #F4F7FC;vertical-align:top}
.cmp-table th{background:#FAF7FF;font-weight:600;color:#333C4E}
.cmp-table td:first-child{color:#78849B;font-weight:500;width:28%}
.cmp-table .best{color:#5AA98C;font-weight:600}
.rec-banner{background:linear-gradient(135deg,#DFAE82,#D9C97E);color:#fff;border-radius:12px;padding:15px 16px;margin-bottom:16px}
.rec-banner h3{font-size:15px;margin-bottom:6px;font-weight:700}
.rec-banner p{font-size:12.5px;line-height:1.65;opacity:.96;margin:0}
.anchor-list{font-size:12.5px;color:#5C6779;background:#FAF7FF;border-radius:10px;padding:12px 14px;line-height:1.9}
.anchor-list b{color:#333C4E}
  .budget-cmp{margin-top:18px}
  .budget-cmp-title{font-size:15px;font-weight:600;color:#333C4E;margin-bottom:12px;display:flex;align-items:center;gap:6px}
  .budget-note{margin-top:12px;font-size:12.5px;line-height:1.7;color:#78849B;background:#FAF7FF;border-radius:10px;padding:12px 14px}
  .budget-note b{color:#333C4E}
.hist-card{border:1px solid #E4EAF4;border-left:4px solid #AEB7C4;background:#FAF7FF;border-radius:12px;padding:14px;margin-bottom:16px}
.hist-card h3{font-size:15px;margin:0 0 6px;color:#333C4E}
.hist-card .hist-meta{font-size:12px;color:#78849B;margin-bottom:8px}
.hist-card ul{margin:6px 0;padding-left:18px}
.hist-card li{font-size:13px;color:#5C6779;line-height:1.6;margin-bottom:3px}
.hist-card .hist-cmp{font-size:13px;color:#B36B00;background:#F1F5FB;padding:8px 10px;border-radius:8px;margin-top:8px;font-weight:600}
.backup-sub2{font-size:14px;font-weight:600;color:#333C4E;margin:18px 0 10px}

@media(max-width:768px){.dir-cards{grid-template-columns:1fr}.route-flow{font-size:11px}.rf-node{padding:5px 9px}}

  /* 行程日历 + 实时天气（与主页/工作台配色统一） */
  .wb-cw{display:grid;grid-template-columns:1.7fr 1fr;gap:14px;margin-bottom:16px}
  @media(max-width:680px){.wb-cw{grid-template-columns:1fr}}
  .cw-card{background:var(--card-bg);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px;position:relative}
  .cw-card.cal{border-top:4px solid var(--primary)}
  .cw-card.wth{border-top:4px solid var(--success)}
  .cw-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
  .cw-title{font-size:15px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:6px}
  .cw-nav{display:flex;align-items:center;gap:6px}
  .cw-nav button{width:28px;height:28px;border-radius:8px;background:var(--primary-light);color:var(--primary);font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center}
  .cw-nav button:hover{background:var(--primary);color:#fff}
  .cw-nav .cw-m{font-size:13px;font-weight:600;color:var(--text);min-width:74px;text-align:center}
  .cw-week{display:grid;grid-template-columns:repeat(7,1fr);font-size:11px;color:var(--text-light);text-align:center;margin-bottom:4px}
  .cw-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .cw-cell{height:38px;border-radius:8px;background:#F8FBFF;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;color:var(--text);position:relative;overflow:hidden}
  .cw-cell.dim{visibility:hidden}
  .cw-cell.wk{color:var(--text-light)}
  .cw-cell.today{outline:2px solid var(--info);outline-offset:-2px;font-weight:700}
  .cw-cell .cw-d{line-height:1.1}
  .cw-cell .cw-e{font-size:11px;line-height:1;margin-top:1px}
  .cw-foot{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px;font-size:12px;color:var(--text-light)}
  .cw-foot .trip-span{color:var(--primary);font-weight:600}
  .cw-legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .cw-leg{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--text);background:#F8FBFF;border-radius:10px;padding:2px 8px}
  .cw-leg i{width:8px;height:8px;border-radius:50%;display:inline-block}
  .cw-wth-body{padding-top:2px}
  .cw-temp{font-size:36px;font-weight:800;color:var(--success);line-height:1.1}
  .cw-temp small{font-size:15px;font-weight:600;color:var(--text-light)}
  .cw-desc{font-size:13px;color:var(--text-light);margin-top:4px}
  .cw-hint{margin-top:12px;font-size:12px;color:#5A86C4;background:var(--success-light);border-radius:10px;padding:8px 10px;line-height:1.5}

  /* Ticket & Weather module 票况·天气 */
  .tw-h2{font-size:15px;font-weight:600;color:var(--text);margin-bottom:10px;display:flex;align-items:center;gap:6px}
  .tw-tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:20px;color:#fff;vertical-align:middle;white-space:nowrap}
  .tw-blue{background:var(--info)} .tw-green{background:var(--success)} .tw-brand{background:var(--primary)} .tw-red{background:var(--danger)}
  .tw-table{width:100%;border-collapse:collapse;font-size:13px;margin-top:4px}
  .tw-table th,.tw-table td{border:1px solid var(--border);padding:7px 9px;text-align:left;vertical-align:top}
  .tw-table th{background:#F4F7FC;font-weight:600;color:var(--text)}
  .tw-table tr:nth-child(even) td{background:#F4FFFC}
  .tw-seg{font-weight:600;color:var(--text)}
  .tw-price{color:var(--danger);font-weight:700;white-space:nowrap}
  .tw-tight{color:var(--danger);font-weight:600}
  .tw-easy{color:var(--success);font-weight:600}
  .tw-mid{color:var(--primary);font-weight:600}
  .tw-note{font-size:12px;color:var(--text-light);margin-top:8px;line-height:1.5}
  .tw-warn{background:var(--danger-light);border-left:4px solid var(--danger);padding:10px 12px;border-radius:8px;font-size:13px;margin-top:8px;line-height:1.5}
  .tw-sum{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px}
  .tw-sum .box{flex:1;min-width:140px;background:#F1F5FB;border:1px solid #FFE6A8;border-radius:10px;padding:12px}
  .tw-sum .box b{font-size:20px;color:var(--info);display:block}
  .tw-sum .box span{font-size:12px;color:var(--text-light)}
  .tw-list{margin:6px 0 0 18px;font-size:13px;line-height:1.6}
  .tw-link{display:inline-flex;align-items:center;gap:6px;margin-top:4px;color:var(--info);font-size:13px;font-weight:600;text-decoration:none}
  .tw-link:hover{text-decoration:underline}

  /* 背景柔光斑：低透明度彩色晕染，增加层次但不抢内容 */
  body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:-1;
    background:
      radial-gradient(420px 320px at 8% 4%, rgba(255,107,107,.10), transparent 62%),
      radial-gradient(400px 300px at 92% 10%, rgba(127,168,216,.10), transparent 62%),
      radial-gradient(480px 340px at 50% 98%, rgba(166,108,255,.09), transparent 64%);}

  /* 行程节点：起点/终点用不同糖果色 */
  .rf-node.start{background:#DE9090;border-color:#DE9090}
  .rf-node.end{background:#7FCBB8;border-color:#7FCBB8}
  /* 必体验条：改为淡彩底 + 彩色左边条 */
  .list-item-must{background:#EAF2FF;border-left:3px solid #7FA8D8}
  .dest-card-must{background:#FFF3E4}
</style>
</head>
<body>

<!-- Header -->
<header class="app-header">
  <h1>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="24" height="24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
    十月旅行规划
  </h1>
  <div class="header-actions">
    <div class="sync-badge offline" id="syncBadge">
      <span class="sync-dot"></span>
      <span id="syncText">离线模式</span>
    </div>
    <button class="icon-btn" id="btnExport" title="导出JSON备份">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    </button>
    <button class="icon-btn" id="btnImport" title="导入恢复">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
    </button>
    <input type="file" id="importFile" accept=".json" style="display:none">
  </div>
</header>

<div class="container">

  <!-- Overview 行程总览 -->
  <section class="overview">
    <h2>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M8 19h7a4 4 0 0 0 0-8H9a4 4 0 0 1 0-8h7"/></svg>
      行程总览 · 10/3 出发 → 10/17 到家
    </h2>
    <div class="stats-row" id="statsRow"></div>
    <div class="route-scroll">
      <div class="route-map" id="routeMap"></div>
      <div class="route-legend">
        <span><svg class="legend-plane" viewBox="0 0 24 24" fill="currentColor"><path d="M2.5 19.5l19-7.5L2.5 4.5 2.5 10l13 2-13 2z"/></svg>飞机 5 段</span>
        <span><svg class="legend-train" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="13" rx="2"/><path d="M4 10h16"/><circle cx="8" cy="13" r="1"/><circle cx="16" cy="13" r="1"/><path d="M6 16l-2 4M18 16l2 4"/></svg>高铁 6 段</span>
      </div>
    </div>
    <div class="overview-todos" id="overviewTodos">
      <span class="ot-label">出行前待办：</span>
      <span class="todo-chip">港澳通行证签注（2人）</span>
      <span class="todo-chip">GS7634 出票确认班期</span>
      <span class="todo-chip">玉龙雪山索道票提前抢</span>
      <span class="todo-chip">鼓浪屿轮渡票</span>
    </div>
  </section>

  <!-- 行程日历 + 实时天气 -->
  <section class="wb-cw">
    <div class="cw-card cal">
      <div class="cw-head">
        <span class="cw-title">📅 行程日历</span>
        <div class="cw-nav">
          <button id="wb-calPrev" title="上个月">‹</button>
          <span class="cw-m" id="wb-calTitle">—</span>
          <button id="wb-calNext" title="下个月">›</button>
        </div>
      </div>
      <div class="cw-week"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>
      <div class="cw-grid" id="wb-calGrid"></div>
      <div class="cw-foot"><span class="trip-span">🧳 10/3–10/17 · 15天14晚</span><span>安庆 → 7城 → 安庆</span></div>
      <div class="cw-legend" id="wb-calLegend"></div>
    </div>
    <div class="cw-card wth">
      <div class="cw-head">
        <span class="cw-title">🌤️ <span id="wb-wthLabel">实时天气</span></span>
      </div>
      <div class="cw-wth-body">
        <div class="cw-temp" id="wb-wthTemp">—</div>
        <div class="cw-desc" id="wb-wthDesc">定位中…</div>
        <div class="cw-hint">🧳 10月华南/西南多晴 23–29°C；丽江、重庆山区早晚凉，备薄外套</div>
      </div>
    </div>
  </section>

  <!-- Today Section -->
  <section class="today-section">
    <h2>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      今天要处理
    </h2>
    <div id="todayList"></div>
  </section>

  <!-- Tabs -->
  <nav class="tabs">
    <button class="tab-btn active" data-tab="itinerary">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><circle cx="12" cy="15" r="2"/></svg>
      <span>行程规划</span>
    </button>
    <button class="tab-btn" data-tab="budget">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
      <span>预算管理</span>
    </button>
    <button class="tab-btn" data-tab="destinations">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>
      <span>目的地看板</span>
    </button>
  </nav>

  <!-- Module: Itinerary -->
  <div class="module active" id="module-itinerary">
    <div class="add-form">
      <div class="add-form-header">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        添加行程
      </div>
      <div class="form-row">
        <div class="form-field">
          <label>日期</label>
          <input type="date" id="itin-date">
        </div>
        <div class="form-field">
          <label>活动/景点</label>
          <input type="text" id="itin-title" placeholder="如：故宫博物院">
        </div>
      </div>
      <div class="form-row">
        <div class="form-field">
          <label>交通方式</label>
          <select id="itin-transport">
            <option value="">选择交通</option>
            <option value="地铁">地铁</option>
            <option value="公交">公交</option>
            <option value="出租车">出租车</option>
            <option value="步行">步行</option>
            <option value="自驾">自驾</option>
            <option value="高铁">高铁</option>
            <option value="飞机">飞机</option>
          </select>
        </div>
        <div class="form-field">
          <label>状态</label>
          <select id="itin-status">
            <option value="待办">待办</option>
            <option value="进行中">进行中</option>
            <option value="已完成">已完成</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-field">
          <label>备注</label>
          <textarea id="itin-notes" placeholder="如：上午9点入园，预留3小时"></textarea>
        </div>
      </div>
      <button class="btn-add" id="btnAddItinerary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        添加行程
      </button>
    </div>
    <div id="itineraryList"></div>
  </div>

  <!-- Module: Budget -->
  <div class="module" id="module-budget">
    <div class="budget-summary">
      <div class="budget-card expense">
        <div class="label">总支出</div>
        <div class="value" id="totalExpense">¥0</div>
      </div>
      <div class="budget-card income">
        <div class="label">总收入</div>
        <div class="value" id="totalIncome">¥0</div>
      </div>
      <div class="budget-card balance">
        <div class="label">结余</div>
        <div class="value" id="balance">¥0</div>
      </div>
    </div>

    <div class="chart-section" id="chartSection">
      <h3>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></svg>

      </h3>
      <div class="pie-wrap" id="pieWrap"></div>

    <div class="add-form">
      <div class="add-form-header">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        添加收支
      </div>
      <div class="form-row">
        <div class="form-field">
          <label>日期</label>
          <input type="date" id="bud-date">
        </div>
        <div class="form-field">
          <label>项目名称</label>
          <input type="text" id="bud-title" placeholder="如：住宿费">

      </div>
      <div class="form-row">
        <div class="form-field">
          <label>金额</label>

            <option value="购物">购物</option>
            <option value="其他">其他</option>

        添加收支
      </button>
    </div>
    <div id="budgetList"></div>
  </div>

  <!-- Module: Destinations -->
  <div class="module" id="module-destinations">
    <div class="add-form">
      <div class="add-form-header">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>

          <select id="dest-priority">

            <option value="中">中</option>
            <option value="低">低</option>

      </div>
      <div class="form-row">
        <div class="form-field">
          <label>推荐理由</label>
          <input type="text" id="dest-reason" placeholder="如：秋季赏叶最佳">

        <div class="form-field">
          <label>状态</label>
          <select id="dest-status">

            <option value="计划中">计划中</option>
            <option value="已去">已去</option>
            <option value="已放弃">已放弃</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-field">
          <label>备注</label>
          <textarea id="dest-notes" placeholder="可选"></textarea>
        </div>
      </div>
      <button class="btn-add" id="btnAddDest">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        添加目的地
      </button>

function normalizeDate(dateStr) {
  if (!dateStr) return "";
  if (typeof dateStr === "string") {

  }
  return "";
}
function formatDate(dateStr) {

}

      var result = await db.query({ databaseId: DATABASE_ID, pageSize: 500 });
      var records = [];
      if (result && result.results) {
        for (var i = 0; i < result.results.length; i++) {
          var row = result.results[i];

            id: row._id || row.id || genId(),
            rid: row._id || row.id || "",
            type: row["类型"] || "",
            date: normalizeDate(row["日期"]),

            category: row["分类"] || "",
            status: row["状态"] || "",
            priority: row["优先级"] || "",
            notes: row["备注"] || ""
          });
        }
      }
      allRecords = records;
      setSyncMode("online");
      if (allRecords.length === 0) {
        var cached = localStorage.getItem(STORAGE_KEY);
        if (cached) {
          try { allRecords = JSON.parse(cached); } catch(e2) { allRecords = getExampleData(); saveLocal(); }
        } else {
          allRecords = getExampleData();
          saveLocal();
        }
      }
      return;
    } catch (e) {
      console.error("SDK query failed, falling back to localStorage", e);
    }
  }
  // Fallback: localStorage
  var stored = localStorage.getItem(STORAGE_KEY);
  if (stored) {
    try {
      allRecords = JSON.parse(stored);
    } catch (e2) {
      allRecords = getExampleData();
    }
  } else {
    allRecords = getExampleData();
    saveLocal();
  }
  setSyncMode("offline");
}

// Save to localStorage
function saveLocal() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(allRecords));
}

// Add record
async function addRecord(record) {
  if (isSdkAvailable() && syncMode === "online") {
    try {
      var db = window.__SMART_PAGE__.database;
      var properties = buildProperties(record);
      var result = await db.addRecord({ databaseId: DATABASE_ID, properties: properties });
      if (result && result.id) {
        record.id = result.id;
        record.rid = result.id;
      }
    } catch (e) {
      console.error("SDK addRecord failed", e);
      record.id = genId();
    }
  } else {
    record.id = genId();
  }
  allRecords.push(record);
  saveLocal();
  renderAll();
}

// Update record
async function updateRecord(id, fields) {
  var rec = allRecords.find(function(r) { return r.id === id; });
  if (!rec) return;
  Object.assign(rec, fields);
  saveLocal();
  if (isSdkAvailable() && syncMode === "online" && rec.rid) {
    try {
      var db = window.__SMART_PAGE__.database;
      var properties = buildProperties(rec);
      await db.updateRecord({ databaseId: DATABASE_ID, recordId: rec.rid, properties: properties });
    } catch (e) {
      console.error("SDK updateRecord failed", e);
    }
  }
  renderAll();
}

// Delete record
async function deleteRecord(id) {
  var rec = allRecords.find(function(r) { return r.id === id; });
  if (!rec) return;
  allRecords = allRecords.filter(function(r) { return r.id !== id; });
  saveLocal();
  if (isSdkAvailable() && syncMode === "online" && rec.rid) {
    try {
      var db = window.__SMART_PAGE__.database;
      await db.deleteRecord({ databaseId: DATABASE_ID, recordId: rec.rid });
    } catch (e) {
      console.error("SDK deleteRecord failed", e);
    }
  }
  renderAll();
}

// Build properties for SDK
function buildProperties(rec) {
  var props = {};
  props["类型"] = { select: OPTIONS_MAP["类型"][rec.type] ? OPTIONS_MAP["类型"][rec.type].id : rec.type };
  if (rec.date) {

  props["金额"] = { number: rec.amount || 0 };
  props["分类"] = { text: rec.category || "" };
  props["状态"] = { text: rec.status || "" };
  props["优先级"] = { text: rec.priority || "" };
  props["备注"] = { text: rec.notes || "" };
  return props;
}

function renderOverview() {
  var today = new Date(getTodayStr() + "T00:00:00");
  var start = new Date(TRIP_START + "T00:00:00");
  var end = new Date(TRIP_END + "T00:00:00");
  var oneDay = 86400000;
  var countHtml;
  if (today < start) {
    countHtml = Math.ceil((start - today) / oneDay) + '<small> 天后出发</small>';
  } else if (today <= end) {
    countHtml = '<small>Day </small>' + (Math.floor((today - start) / oneDay) + 1) + '<small>/15</small>';
  } else {
    countHtml = '<small>行程已收官</small>';
  }

  var transportSum = 0, transportCount = 0;
  for (var i = 0; i < allRecords.length; i++) {
    var r = allRecords[i];
    if (r.type === "预算管理" && r.category === "交通" && r.status === "支出") {
      transportSum += r.amount || 0;
      transportCount++;
    }
  }

  document.getElementById("statsRow").innerHTML =
    '<div class="stat-card"><div class="stat-value">' + countHtml + '</div><div class="stat-label">倒计时</div></div>' +
    '<div class="stat-card"><div class="stat-value">15<small>天14晚</small></div><div class="stat-label">9 城环线</div></div>' +
    '<div class="stat-card"><div class="stat-value">' + transportCount + '<small> 段</small></div><div class="stat-label">已定价大交通</div></div>' +
    '<div class="stat-card"><div class="stat-value">¥' + transportSum.toLocaleString() + '</div><div class="stat-label">2人交通支出</div></div>';

  var html = "";
  for (var j = 0; j < ROUTE_STOPS.length; j++) {
    var s = ROUTE_STOPS[j];
    var cls = "route-stop" + (s.home ? " home" : "") + (s.daytrip ? " daytrip" : "");
    html += '<div class="' + cls + '" title="' + s.city + ' ' + s.dates + (s.nights ? " " + s.nights : "") + '">';
    html += '<div class="route-dot"></div>';
    html += '<div class="route-city">' + s.city + '</div>';
    html += '<div class="route-dates">' + s.dates + '</div>';
    if (s.nights) html += '<div class="route-nights">' + s.nights + '</div>';
    html += '</div>';
    if (j < ROUTE_SEGS.length) {
      var g = ROUTE_SEGS[j];
      html += '<div class="route-seg"><div class="seg-line"></div><div class="seg-icon ' + g.type + '">' + (g.type === "plane" ? PLANE_ICON : (g.type === "ferry" ? FERRY_ICON : TRAIN_ICON)) + '</div><div class="seg-date">' + g.date + '</div></div>';
    }
  }
  document.getElementById("routeMap").innerHTML = html;
}

function renderToday() {
  var container = document.getElementById("todayList");
  var today = getTodayStr();
  var upcoming = getDateStr(3);
  var items = [];

  for (var i = 0; i < allRecords.length; i++) {
    var r = allRecords[i];
    if (r.type !== "行程规划") continue;
    if (!r.date || r.date === "1970-01-01") continue;
    if (r.status === "已完成" || r.status === "已去" || r.status === "已放弃") continue;
    if (r.type === "预算管理") continue;

    var cls = "";
    var badge = "";
    var badgeText = "";
    if (r.date < today) {
      cls = "overdue";
      badge = "badge-overdue";
      badgeText = "逾期";
    } else if (r.date === today) {
      cls = "today";
      badge = "badge-today";
      badgeText = "今天";
    } else if (r.date <= upcoming) {
      cls = "upcoming";
      badge = "badge-upcoming";
      badgeText = "即将到期";
    } else {
      continue;
    }
    items.push({ record: r, cls: cls, badge: badge, badgeText: badgeText });
  }

  items.sort(function(a, b) {
    return a.record.date.localeCompare(b.record.date);
  });

  if (items.length === 0) {
    container.innerHTML = '<div class="today-empty">暂无待处理事项，一切就绪！</div>';
    return;
  }

  var html = "";
  for (var j = 0; j < items.length; j++) {
    var item = items[j];
    var r = item.record;
    var actionText = r.status === "待办" ? "开始" : "完成";
    html += '<div class="today-item ' + item.cls + '">'
      + '<div class="today-item-info">'
      +   '<div class="today-item-title">' + escapeHtml(r.title) + '</div>'
      +   '<div class="today-item-meta">'
      +     '<span class="today-item-badge ' + item.badge + '">' + item.badgeText + '</span>'
      +     '<span>' + formatDate(r.date) + '</span>'
      +     (r.category ? '<span>· ' + escapeHtml(r.category) + '</span>' : '')
      +   '</div>'
      + '</div>'
      + '<button class="today-action" data-id="' + r.id + '" data-action="quick">' + actionText + '</button>'
      + '</div>';
  }
  container.innerHTML = html;

  var btns = container.querySelectorAll(".today-action");
  for (var k = 0; k < btns.length; k++) {
    btns[k].addEventListener("click", function(e) {
      var id = this.getAttribute("data-id");
      var rec = allRecords.find(function(r) { return r.id === id; });
      if (!rec) return;
      if (rec.status === "待办") {
        updateRecord(id, { status: "进行中" });
      } else if (rec.status === "进行中") {
        updateRecord(id, { status: "已完成" });
      } else {
        updateRecord(id, { status: "待办" });
      }
    });
  }
}

function renderPieChart(catTotals, total) {
  var wrap = document.getElementById("pieWrap");
  if (total <= 0) {
    wrap.innerHTML = '<div class="empty-state" style="padding:12px"><p>暂无支出数据</p></div>';
    return;
  }

  var cats = Object.keys(catTotals).filter(function(c) { return catTotals[c] > 0; });
  if (cats.length === 0) {
    wrap.innerHTML = '<div class="empty-state" style="padding:12px"><p>暂无支出数据</p></div>';
    return;
  }

  var radius = 60;
  var cx = 70, cy = 70;
  var circumference = 2 * Math.PI * radius;
  var offset = 0;
  var svgParts = '<svg class="pie-chart" width="140" height="140" viewBox="0 0 140 140">';
  var legendHtml = "";

  for (var i = 0; i < cats.length; i++) {
    var cat = cats[i];
    var val = catTotals[cat];
    var pct = val / total;
    var color = CATEGORY_COLORS[cat] || "#78849B";
    var dashLen = circumference * pct;
    svgParts += '<circle cx="' + cx + '" cy="' + cy + '" r="' + radius + '" fill="none" stroke="' + color + '" stroke-width="20" stroke-dasharray="' + dashLen + ' ' + (circumference - dashLen) + '" stroke-dashoffset="' + (-offset) + '" transform="rotate(-90 ' + cx + ' ' + cy + ')"/>';
    offset += dashLen;
    legendHtml += '<div class="pie-legend-item">'
      + '<div class="pie-legend-dot" style="background:' + color + '"></div>'
      + '<span>' + escapeHtml(cat) + '</span>'
      + '<span class="pie-legend-amount">' + formatMoney(val) + ' (' + (pct * 100).toFixed(1) + '%)</span>'
      + '</div>';
  }
  svgParts += '<text x="' + cx + '" y="' + (cy + 5) + '" text-anchor="middle" font-size="14" font-weight="700" fill="#333C4E">' + formatMoney(total).replace("¥", "¥") + '</text>';
  svgParts += '</svg>';

  wrap.innerHTML = '<div class="pie-chart">' + svgParts + '</div><div class="pie-legend">' + legendHtml + '</div>';
}

// ==================== List Actions ====================
function bindListActions(container, moduleType) {
  var btns = container.querySelectorAll("button[data-action]");
  for (var i = 0; i < btns.length; i++) {
    btns[i].addEventListener("click", function(e) {
      e.stopPropagation();
      var id = this.getAttribute("data-id");
      var action = this.getAttribute("data-action");

      if (action === "toggle") {
        var rec = allRecords.find(function(r) { return r.id === id; });
        if (!rec) return;
        if (rec.status === "已完成") {
          updateRecord(id, { status: "待办" });
        } else {
          updateRecord(id, { status: "已完成" });
        }
      } else if (action === "edit-itin") {
        openEditModal(id, "itinerary");
      } else if (action === "edit-bud") {
        openEditModal(id, "budget");
      } else if (action === "edit-dest") {
        openEditModal(id, "dest");
      } else if (action === "delete") {
        showConfirm("删除确认", "确定要删除这条记录吗？此操作不可撤销。", function() {
          deleteRecord(id);
        });
      }
    });
  }
}

function openEditModal(id, type) {
  var rec = allRecords.find(function(r) { return r.id === id; });
  if (!rec) return;
  editTarget = rec;

  var body = document.getElementById("editModalBody");
  var title = document.getElementById("editModalTitle");
  title.textContent = "编辑" + (type === "itinerary" ? "行程" : type === "budget" ? "收支" : "目的地");

  var html = "";
  if (type === "itinerary") {
    html = '<div class="form-field"><label>日期</label><input type="date" id="edit-date" value="' + escapeHtml(rec.date) + '"></div>'
      + '<div class="form-field"><label>活动/景点</label><input type="text" id="edit-title" value="' + escapeHtml(rec.title) + '"></div>'
      + '<div class="form-field"><label>交通方式</label><select id="edit-category">'
      + transportOptions(rec.category)
      + '</select></div>'
      + '<div class="form-field"><label>状态</label><select id="edit-status">'
      + '<option value="待办"' + (rec.status === "待办" ? " selected" : "") + '>待办</option>'
      + '<option value="进行中"' + (rec.status === "进行中" ? " selected" : "") + '>进行中</option>'
      + '<option value="已完成"' + (rec.status === "已完成" ? " selected" : "") + '>已完成</option>'
      + '</select></div>'
      + '<div class="form-field"><label>备注</label><textarea id="edit-notes">' + escapeHtml(rec.notes) + '</textarea></div>';
  } else if (type === "budget") {
    html = '<div class="form-field"><label>日期</label><input type="date" id="edit-date" value="' + escapeHtml(rec.date) + '"></div>'
      + '<div class="form-field"><label>项目名称</label><input type="text" id="edit-title" value="' + escapeHtml(rec.title) + '"></div>'
      + '<div class="form-row">'
      + '<div class="form-field"><label>金额</label><input type="number" id="edit-amount" value="' + rec.amount + '" min="0" step="0.01"></div>'
      + '<div class="form-field"><label>分类</label><select id="edit-category">'
      + budgetCategoryOptions(rec.category)
      + '</select></div>'
      + '</div>'
      + '<div class="form-field"><label>类型</label><select id="edit-status">'
      + '<option value="支出"' + (rec.status === "支出" ? " selected" : "") + '>支出</option>'
      + '<option value="收入"' + (rec.status === "收入" ? " selected" : "") + '>收入</option>'
      + '</select></div>'
      + '<div class="form-field"><label>备注</label><textarea id="edit-notes">' + escapeHtml(rec.notes) + '</textarea></div>';
  } else {
    html = '<div class="form-field"><label>地点名称</label><input type="text" id="edit-title" value="' + escapeHtml(rec.title) + '"></div>'
      + '<div class="form-row">'
      + '<div class="form-field"><label>优先级</label><select id="edit-priority">'
      + '<option value="高"' + (rec.priority === "高" ? " selected" : "") + '>高</option>'
      + '<option value="中"' + (rec.priority === "中" ? " selected" : "") + '>中</option>'
      + '<option value="低"' + (rec.priority === "低" ? " selected" : "") + '>低</option>'
      + '</select></div>'
      + '<div class="form-field"><label>状态</label><select id="edit-status">'
      + '<option value="想去"' + (rec.status === "想去" ? " selected" : "") + '>想去</option>'
      + '<option value="计划中"' + (rec.status === "计划中" ? " selected" : "") + '>计划中</option>'
      + '<option value="已去"' + (rec.status === "已去" ? " selected" : "") + '>已去</option>'
      + '<option value="已放弃"' + (rec.status === "已放弃" ? " selected" : "") + '>已放弃</option>'
      + '</select></div>'
      + '</div>'
      + '<div class="form-field"><label>推荐理由</label><input type="text" id="edit-category" value="' + escapeHtml(rec.category) + '"></div>'
      + '<div class="form-field"><label>备注</label><textarea id="edit-notes">' + escapeHtml(rec.notes) + '</textarea></div>';
  }

  body.innerHTML = html;
  document.getElementById("editModal").classList.add("show");

  document.getElementById("btnSaveEdit").onclick = function() {
    var fields = {};
    var editDate = document.getElementById("edit-date");
    var editTitle = document.getElementById("edit-title");
    var editCategory = document.getElementById("edit-category");
    var editStatus = document.getElementById("edit-status");
    var editNotes = document.getElementById("edit-notes");

    if (editDate) fields.date = editDate.value;
    if (editTitle) fields.title = editTitle.value;
    if (editCategory) fields.category = editCategory.value;
    if (editStatus) fields.status = editStatus.value;
    if (editNotes) fields.notes = editNotes.value;

    if (type === "budget") {
      var editAmount = document.getElementById("edit-amount");
      if (editAmount) fields.amount = Number(editAmount.value) || 0;
    }
    if (type === "dest") {
      var editPriority = document.getElementById("edit-priority");
      if (editPriority) fields.priority = editPriority.value;
    }

    updateRecord(editTarget.id, fields);
    closeEditModal();
  };
}

function closeEditModal() {
  document.getElementById("editModal").classList.remove("show");
  editTarget = null;
}

function transportOptions(selected) {
  var opts = ["地铁", "公交", "出租车", "步行", "自驾", "高铁", "飞机"];
  var html = "";
  for (var i = 0; i < opts.length; i++) {
    html += '<option value="' + opts[i] + '"' + (selected === opts[i] ? " selected" : "") + '>' + opts[i] + '</option>';
  }
  return html;
}
function budgetCategoryOptions(selected) {
  var opts = ["交通", "住宿", "餐饮", "门票", "购物", "其他"];
  var html = "";
  for (var i = 0; i < opts.length; i++) {
    html += '<option value="' + opts[i] + '"' + (selected === opts[i] ? " selected" : "") + '>' + opts[i] + '</option>';
  }
  return html;
}

// ==================== Confirm Dialog ====================
function showConfirm(title, msg, callback) {
  document.getElementById("confirmTitle").textContent = title;
  document.getElementById("confirmMsg").textContent = msg;
  confirmCallback = callback;
  document.getElementById("confirmDialog").classList.add("show");
}

// ==================== Backup Reminder ====================
function checkBackupReminder() {
  var existing = document.querySelector(".backup-reminder");
  if (allRecords.length >= 30 && !existing) {
    var reminder = document.createElement("div");
    reminder.className = "backup-reminder";
    reminder.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12" y2="17"/></svg>数据已积累 ' + allRecords.length + ' 条，建议导出备份';
    var container = document.querySelector(".container");
    container.insertBefore(reminder, container.firstChild);
  } else if (allRecords.length < 30 && existing) {
    existing.remove();
  }
}

// ==================== Export / Import ====================
function exportData() {
  var data = JSON.stringify(allRecords, null, 2);
  var blob = new Blob([data], { type: "application/json" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = "travel_planner_backup_" + getTodayStr() + ".json";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function importData(file) {
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var data = JSON.parse(e.target.result);
      if (!Array.isArray(data)) {
        alert("文件格式不正确：需要JSON数组");
        return;
      }
      showConfirm("导入确认", "导入将覆盖当前所有数据（" + allRecords.length + "条），确定继续吗？", function() {
        allRecords = data.map(function(r) {
          return {
            id: r.id || genId(),
            rid: r.rid || "",
            type: r.type || "",
            date: r.date || "",
            title: r.title || "",
            amount: Number(r.amount) || 0,
            category: r.category || "",
            status: r.status || "",
            priority: r.priority || "",
            notes: r.notes || ""
          };
        });
        saveLocal();
        renderAll();
      });
    } catch (err) {
      alert("导入失败：文件解析错误");
    }
  };
  reader.readAsText(file);
}

// ==================== Init ====================
function init() {
  // Set default dates
  var today = getTodayStr();
  document.getElementById("itin-date").value = "2026-10-03";
  document.getElementById("bud-date").value = today;

  // Tab switching
  var tabBtns = document.querySelectorAll(".tab-btn");
  for (var i = 0; i < tabBtns.length; i++) {
    tabBtns[i].addEventListener("click", function() {
      for (var j = 0; j < tabBtns.length; j++) {
        tabBtns[j].classList.remove("active");
      }
      this.classList.add("active");
      var tab = this.getAttribute("data-tab");
      var modules = document.querySelectorAll(".module");
      for (var k = 0; k < modules.length; k++) {
        modules[k].classList.remove("active");
      }
      document.getElementById("module-" + tab).classList.add("active");
    });
  }

  // Add buttons
  document.getElementById("btnAddItinerary").addEventListener("click", function() {
    var date = document.getElementById("itin-date").value;
    var title = document.getElementById("itin-title").value.trim();
    var transport = document.getElementById("itin-transport").value;
    var status = document.getElementById("itin-status").value;
    var notes = document.getElementById("itin-notes").value.trim();
    if (!title) { alert("请输入活动/景点名称"); return; }
    addRecord({
      type: "行程规划", date: date, title: title, amount: 0,
      category: transport, status: status, priority: "", notes: notes
    });
    document.getElementById("itin-title").value = "";
    document.getElementById("itin-notes").value = "";
    document.getElementById("itin-transport").selectedIndex = 0;
    document.getElementById("itin-status").selectedIndex = 0;
  });

  document.getElementById("btnAddBudget").addEventListener("click", function() {
    var date = document.getElementById("bud-date").value;
    var title = document.getElementById("bud-title").value.trim();
    var amount = Number(document.getElementById("bud-amount").value) || 0;
    var category = document.getElementById("bud-category").value;
    var type = document.getElementById("bud-type").value;
    var notes = document.getElementById("bud-notes").value.trim();
    if (!title) { alert("请输入项目名称"); return; }
    if (amount <= 0) { alert("请输入有效金额"); return; }
    addRecord({
      type: "预算管理", date: date, title: title, amount: amount,
      category: category, status: type, priority: "", notes: notes
    });
    document.getElementById("bud-title").value = "";
    document.getElementById("bud-amount").value = "";
    document.getElementById("bud-notes").value = "";
  });

  document.getElementById("btnAddDest").addEventListener("click", function() {
    var title = document.getElementById("dest-title").value.trim();
    var reason = document.getElementById("dest-reason").value.trim();
    var priority = document.getElementById("dest-priority").value;
    var status = document.getElementById("dest-status").value;
    var notes = document.getElementById("dest-notes").value.trim();
    if (!title) { alert("请输入地点名称"); return; }
    addRecord({
      type: "目的地看板", date: "", title: title, amount: 0,
      category: reason, status: status, priority: priority, notes: notes
    });
    document.getElementById("dest-title").value = "";
    document.getElementById("dest-reason").value = "";
    document.getElementById("dest-notes").value = "";
    document.getElementById("dest-status").selectedIndex = 0;
  });

  // Export/Import
  document.getElementById("btnExport").addEventListener("click", exportData);
  document.getElementById("btnImport").addEventListener("click", function() {
    document.getElementById("importFile").click();
  });
  document.getElementById("importFile").addEventListener("change", function() {
    if (this.files.length > 0) {
      importData(this.files[0]);
      this.value = "";
    }
  });

  // Modal close
  document.getElementById("btnCloseModal").addEventListener("click", closeEditModal);
  document.getElementById("btnCancelEdit").addEventListener("click", closeEditModal);
  document.getElementById("editModal").addEventListener("click", function(e) {
    if (e.target === this) closeEditModal();
  });

  // Confirm dialog
  document.getElementById("btnConfirmCancel").addEventListener("click", function() {
    document.getElementById("confirmDialog").classList.remove("show");
    confirmCallback = null;
  });
  document.getElementById("btnConfirmOk").addEventListener("click", function() {
    document.getElementById("confirmDialog").classList.remove("show");
    if (confirmCallback) confirmCallback();
    confirmCallback = null;
  });

  // Load data and render
  loadData().then(function() {
    renderAll();
  });
}

// Start
if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", init);
} else {
  init();
}
</script>
  <!-- 行程日历 + 实时天气 -->
  <script>
  (function(){
    // ===== 城市逐日映射（来自 ROUTE_STOPS；home 城市最后写，保留出发/到家日）=====
    function buildCityByDay(){
      var map={};
      var stops=ROUTE_STOPS.slice().sort(function(a,b){return (a.home?1:0)-(b.home?1:0);});
      stops.forEach(function(s){
        var m=String(s.dates).match(/(\d+)\/(\d+)(?:-(\d+))?/);
        if(!m) return;
        var mo=parseInt(m[1],10), start=parseInt(m[2],10), end=m[3]?parseInt(m[3],10):start;
        for(var d=start; d<=end; d++){ map[mo+'/'+d]=s.city; }
      });
      return map;
    }
    var CITY_BY_DAY=buildCityByDay();
    function cityColor(city){ var m=CITY_META[city]; return m&&m.color?m.color:'#7FA8D8'; }
    function cityIcon(city){ var m=CITY_META[city]; return m&&m.icon?m.icon:'📍'; }

    // ===== 日历 =====
    var TRIP_START=new Date(2026,9,5), TRIP_END=new Date(2026,9,19);
    var grid=document.getElementById('wb-calGrid');
    var titleEl=document.getElementById('wb-calTitle');
    var legendEl=document.getElementById('wb-calLegend');
    var today=new Date();
    var view=new Date(2026,9,1); // 默认显示行程月（10月）
    function inTrip(d){ return d>=TRIP_START && d<=TRIP_END; }
    function isToday(d){ return d.getFullYear()===today.getFullYear()&&d.getMonth()===today.getMonth()&&d.getDate()===today.getDate(); }
    function hexA(hex,a){ var h=hex.replace('#',''); var r=parseInt(h.substr(0,2),16),g=parseInt(h.substr(2,2),16),b=parseInt(h.substr(4,2),16); return 'rgba('+r+','+g+','+b+','+a+')'; }
    function renderCal(){
      var y=view.getFullYear(), mo=view.getMonth();
      titleEl.textContent=y+'年'+(mo+1)+'月';
      grid.innerHTML='';
      var first=new Date(y,mo,1).getDay();
      var days=new Date(y,mo+1,0).getDate();
      for(var i=0;i<first;i++){ var dc=document.createElement('div'); dc.className='cw-cell dim'; grid.appendChild(dc); }
      for(var d=1; d<=days; d++){
        var cur=new Date(y,mo,d);
        var cell=document.createElement('div');
        cell.className='cw-cell'+(((cur.getDay()===0)||(cur.getDay()===6))?' wk':'');
        var num=document.createElement('span'); num.className='cw-d'; num.textContent=d; cell.appendChild(num);
        if(isToday(cur)) cell.classList.add('today');
        if(inTrip(cur)){
          var city=CITY_BY_DAY[(mo+1)+'/'+d];
          var col=cityColor(city);
          cell.style.background=hexA(col,0.14);
          cell.style.boxShadow='inset 0 -3px 0 '+col;
          if(city){
            var e=document.createElement('span'); e.className='cw-e'; e.textContent=cityIcon(city); cell.appendChild(e);
            cell.title=city;
          }
        }
        grid.appendChild(cell);
      }
    }
    (function renderLegend(){
      var seen={};
      ROUTE_STOPS.forEach(function(s){
        if(seen[s.city]) return; seen[s.city]=1;
        var leg=document.createElement('span'); leg.className='cw-leg';
        var dot=document.createElement('i'); dot.style.background=cityColor(s.city);
        var txt=document.createElement('span'); txt.textContent=cityIcon(s.city)+' '+s.city;
        leg.appendChild(dot); leg.appendChild(txt); legendEl.appendChild(leg);
      });
    })();
    document.getElementById('wb-calPrev').onclick=function(){ view.setMonth(view.getMonth()-1); renderCal(); };
    document.getElementById('wb-calNext').onclick=function(){ view.setMonth(view.getMonth()+1); renderCal(); };
    renderCal();

    // ===== 天气（Open-Meteo 免费接口 + 浏览器自动定位，与主页同逻辑）=====
    var WMO={0:'晴',1:'大致晴朗',2:'局部多云',3:'阴',45:'雾',48:'雾凇',51:'小毛毛雨',53:'毛毛雨',55:'大毛毛雨',61:'小雨',63:'中雨',65:'大雨',71:'小雪',73:'中雪',75:'大雪',80:'阵雨',81:'强阵雨',82:'暴雨',95:'雷阵雨',96:'雷阵雨伴冰雹',99:'强雷暴伴冰雹'};
    var wLabel=document.getElementById('wb-wthLabel');
    var wTemp=document.getElementById('wb-wthTemp');
    var wDesc=document.getElementById('wb-wthDesc');
    var DEFAULT={lat:30.51,lon:117.05,name:'安徽 · 安庆'};
    wLabel.textContent=DEFAULT.name+' 实时天气';
    function loadWeather(lat,lon,name){
      var url='https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+'&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&timezone=auto';
      fetch(url).then(function(r){return r.json();}).then(function(d){
        var c=d.current||{};
        wTemp.innerHTML=Math.round(c.temperature_2m)+'<small>°C</small>';
        wDesc.textContent=(WMO[c.weather_code]||'未知')+' · 湿度 '+c.relative_humidity_2m+'% · 风速 '+c.wind_speed_10m+' km/h';
        if(name) wLabel.textContent=name+' 实时天气';
      }).catch(function(){ wTemp.textContent='—'; wDesc.textContent='网络受限，刷新重试'; });
    }
    loadWeather(DEFAULT.lat,DEFAULT.lon,null);
    if(navigator.geolocation){
      navigator.geolocation.getCurrentPosition(function(pos){
        var la=pos.coords.latitude, lo=pos.coords.longitude;
        wLabel.textContent='定位中…';
        fetch('https://api.bigdatacloud.net/data/reverse-geocode-client?latitude='+la+'&longitude='+lo+'&localityLanguage=zh').then(function(r){return r.json();}).then(function(g){
          var city=g.city||g.locality||''; var name=city||(g.principalSubdivision||'当前位置');
          loadWeather(la.toFixed(3),lo.toFixed(3),name);
        }).catch(function(){ loadWeather(la.toFixed(3),lo.toFixed(3),'当前位置'); });
      }, function(){ /* 定位失败保持默认安庆 */ }, {timeout:8000,maximumAge:300000});
    }
  })();
  </script>
