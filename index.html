<style>
  :root{
    --bg:#FAFBFC; --col:#ffffff; --txt:#333C4E; --sub:#78849B;
    --line:#E9EDF3; --accent:#6E9BE0; --accent-soft:#EDF3FC;
    --shadow:0 2px 10px rgba(44,54,80,.05);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--txt); padding:28px; min-height:100vh;
  }
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:12px}
  header h1{font-size:22px;letter-spacing:.5px;color:var(--txt);font-weight:600}
  header h1 span{color:var(--sub);font-weight:400;font-size:14px;margin-left:8px}
  .meta{color:var(--sub);font-size:13px}

  /* 信息条：日期 + 天气 */
  .infobar{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px}
  @media(max-width:760px){.infobar{grid-template-columns:1fr}}
  .info-card{background:linear-gradient(135deg,#EDF3FC,#F5F3FB);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:18px 20px;color:var(--txt);display:flex;flex-direction:column;gap:6px}
  .info-card.weather{background:linear-gradient(135deg,#E9F5F2,#EDF3FC)}
  .info-card .label{font-size:13px;color:#6B7688;display:flex;align-items:center;gap:6px}
  .info-card .big{font-size:26px;font-weight:700;line-height:1.2;letter-spacing:.5px}
  .info-card .small{font-size:13px;color:#6B7688}
  .info-card .icon{font-size:22px}

  /* 日历卡 */
  .cal-card{gap:8px}
  .cal-head{display:flex;align-items:center;justify-content:space-between}
  .cal-title{font-size:17px;font-weight:700;letter-spacing:.5px}
  .cal-nav{width:28px;height:28px;border-radius:8px;border:1px solid rgba(44,54,80,.08);background:#fff;color:#5A6478;font-size:17px;cursor:pointer;line-height:1;transition:.15s;padding:0}
  .cal-nav:hover{background:#F1F4F9}
  .cal-week{display:grid;grid-template-columns:repeat(7,1fr);font-size:11px;color:#8A93A5;text-align:center;margin-top:2px}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
  .cal-cell{height:26px;display:flex;align-items:center;justify-content:center;font-size:12.5px;border-radius:7px;position:relative;color:#4A5468}
  .cal-cell.dim{visibility:hidden}
  .cal-cell.wk{color:#98A2B3}
  .cal-cell.today{background:#fff;color:var(--accent);font-weight:700;box-shadow:0 1px 4px rgba(44,54,80,.12)}
  .cal-cell.trip{background:rgba(110,155,224,.18);font-weight:600;color:#3F6FB0}
  .cal-cell.trip::after{content:'';position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--accent)}
  .cal-cell.today.trip{color:var(--accent)}
  .cal-today{font-size:12px;color:#6B7688;display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px}

  /* 工具跳转区 */
  .tools{margin-bottom:22px}
  .tools-title{font-size:16px;font-weight:600;color:var(--txt);margin-bottom:12px;display:flex;align-items:center;gap:8px}
  .tool-card{display:flex;align-items:center;gap:12px;background:var(--col);border-radius:14px;box-shadow:var(--shadow);padding:16px 18px;color:var(--txt);text-decoration:none;transition:transform .15s,box-shadow .15s;border:1px solid var(--line)}
  .tool-card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(44,54,80,.09)}
  .tool-card .t-ico{width:38px;height:38px;border-radius:11px;display:inline-flex;align-items:center;justify-content:center;font-size:19px;flex:0 0 auto;background:#F2F5FA}
  .tool-card .t-body{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start}
  .tool-card .t-name{font-size:15px;font-weight:600;line-height:1.3}
  .tool-card .t-sub{font-size:12px;color:var(--sub);margin-top:2px}
  .tool-card .t-arrow{font-size:22px;color:#B4BCC9;flex:0 0 auto}
  .tool-card.main{background:linear-gradient(135deg,#F5F8FD,#FFFFFF);border-left:3px solid var(--accent);margin-bottom:12px}
  .tool-card.main .t-ico{background:var(--accent-soft)}
  .tool-card.main .t-name{font-size:17px}
  .route-badge{display:inline-block;align-self:flex-start;font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;margin-bottom:6px;letter-spacing:.5px;background:var(--accent-soft);color:#4A7BB5}
  .tool-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:520px){.tool-row{grid-template-columns:1fr}}
  .tool-card.xhs .t-ico{background:#FBEEF1;color:#C4707F}
  .tool-card.fan .t-ico{background:#FBF3E8;color:#C08A4E}
  footer{color:var(--sub);font-size:12px;text-align:center}

  /* 离线提示条 */
  .offline-tip{font-size:12px;color:#4A7CB8;background:#F1F5FB;padding:6px 12px;border-radius:8px;margin-bottom:12px;display:none}
</style>

<script>
  // ===== 日历模块（月历 + 今日高亮 + 行程标注）=====
  (function(){
    const TRIP_START=new Date(2026,9,3), TRIP_END=new Date(2026,9,17); // 十月行程 10/3–10/17
    const grid=document.getElementById('calGrid');
    const title=document.getElementById('calTitle');
    const today=new Date();
    const view=new Date(today.getFullYear(),today.getMonth(),1);
    const WEEKS=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];

    function isToday(d){return d.getFullYear()===today.getFullYear()&&d.getMonth()===today.getMonth()&&d.getDate()===today.getDate();}
    function inTrip(d){return d>=TRIP_START&&d<=TRIP_END;}

    function render(){
      const y=view.getFullYear(),m=view.getMonth();
      title.textContent=`${y}年${m+1}月`;
      grid.innerHTML='';
      const firstDay=new Date(y,m,1).getDay();
      const days=new Date(y,m+1,0).getDate();
      for(let i=0;i<firstDay;i++){
        const c=document.createElement('div');c.className='cal-cell dim';grid.appendChild(c);
      }
      for(let d=1;d<=days;d++){
        const cur=new Date(y,m,d);
        const wd=cur.getDay();
        const c=document.createElement('div');
        c.className='cal-cell'+((wd===0||wd===6)?' wk':'');
        if(isToday(cur))c.classList.add('today');
        if(inTrip(cur))c.classList.add('trip');
        c.textContent=d;
        grid.appendChild(c);
      }
    }

    document.getElementById('calPrev').onclick=()=>{view.setMonth(view.getMonth()-1);render();};
    document.getElementById('calNext').onclick=()=>{view.setMonth(view.getMonth()+1);render();};

    document.getElementById('calToday').innerHTML=
      `<span>今天 ${today.getMonth()+1}月${today.getDate()}日 ${WEEKS[today.getDay()]}</span>`+
      `<span class="trip-legend">🧳 行程 10/3–10/17</span>`;
    document.getElementById('date').textContent=`${today.getFullYear()}/${today.getMonth()+1}/${today.getDate()}`;
    render();
  })();

  // ===== 天气模块（Open-Meteo 免费 API + 浏览器自动定位）=====
  const WMO={0:'晴',1:'大致晴朗',2:'局部多云',3:'阴',45:'雾',48:'雾凇',51:'小毛毛雨',53:'毛毛雨',55:'大毛毛雨',56:'冻毛毛雨',57:'强冻毛毛雨',61:'小雨',63:'中雨',65:'大雨',66:'冻雨',67:'强冻雨',71:'小雪',73:'中雪',75:'大雪',77:'雪粒',80:'阵雨',81:'强阵雨',82:'暴雨',85:'阵雪',86:'强阵雪',95:'雷阵雨',96:'雷阵雨伴冰雹',99:'强雷暴伴冰雹'};
  (function(){
    const DEFAULT={lat:30.51, lon:117.05, name:'安徽 · 安庆'};
    const lbl=document.querySelector('.info-card.weather .label');
    const tempEl=document.getElementById('weatherTemp');
    const descEl=document.getElementById('weatherDesc');

    function loadWeather(lat,lon,locationName){
      const url=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&timezone=auto`;
      fetch(url).then(r=>r.json()).then(d=>{
        const c=d.current||{};
        const temp=Math.round(c.temperature_2m);
        tempEl.textContent=`${temp}°C`;
        descEl.textContent=`${WMO[c.weather_code]||'未知'} · 湿度 ${c.relative_humidity_2m}% · 风速 ${c.wind_speed_10m} km/h`;
        if(locationName){
          lbl.innerHTML=`<span class="icon">📍</span> ${locationName} 实时天气`;
        }
      }).catch(()=>{
        tempEl.textContent='获取失败';
        descEl.textContent='网络受限，请检查网络后刷新';
      });
    }

    // 1) 先加载默认位置（安庆），保证秒开不空白
    loadWeather(DEFAULT.lat, DEFAULT.lon, null);

    // 2) 尝试浏览器定位，成功后自动更新为当前位置天气
    if(navigator.geolocation){
      lbl.innerHTML='<span class="icon">📍</span> 正在定位…';
      navigator.geolocation.getCurrentPosition(pos=>{
        const la=pos.coords.latitude, lo=pos.coords.longitude;
        // 逆地理编码：经纬度 → 中文城市名（BigDataCloud 免费接口，无需 key）
        fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${la}&longitude=${lo}&localityLanguage=zh`)
          .then(r=>r.json())
          .then(g=>{
            const city=g.city||g.locality||'';
            const prov=g.principalSubdivision||'';
            const name=city||(prov||'当前位置');
            loadWeather(la.toFixed(3), lo.toFixed(3), name);
          })
          .catch(()=>loadWeather(la.toFixed(3), lo.toFixed(3), '当前位置'));
      }, err=>{
        // 定位失败/被拒绝：保持默认安庆
        lbl.innerHTML=`<span class="icon">🌤️</span> 安徽 · 安庆 实时天气`;
      }, {timeout:8000, maximumAge:300000});
    }
  })();

</script>
