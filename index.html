<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的主页 · 日期 / 天气 / 实时热榜</title>
<style>
  :root{
    --bg:#f5f6fa; --col:#ffffff; --txt:#1f2330; --sub:#8a90a2;
    --blue:#3d7bff; --green:#22c08a; --red:#ff5a52;
    --shadow:0 4px 18px rgba(31,35,48,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--txt); padding:28px; min-height:100vh;
  }
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:12px}
  header h1{font-size:22px;letter-spacing:.5px}
  header h1 span{color:var(--sub);font-weight:400;font-size:14px;margin-left:8px}
  .meta{color:var(--sub);font-size:13px}

  /* 信息条：日期 + 天气 */
  .infobar{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:24px}
  @media(max-width:760px){.infobar{grid-template-columns:1fr}}
  .info-card{background:linear-gradient(135deg,#3d7bff,#6aa1ff);border-radius:14px;box-shadow:var(--shadow);padding:18px 20px;color:#fff;display:flex;flex-direction:column;gap:6px}
  .info-card.weather{background:linear-gradient(135deg,#22c08a,#4fd6a6)}
  .info-card .label{font-size:13px;opacity:.85;display:flex;align-items:center;gap:6px}
  .info-card .big{font-size:26px;font-weight:700;line-height:1.2}
  .info-card .small{font-size:13px;opacity:.9}
  .info-card .icon{font-size:22px}

  /* 日历卡 */
  .cal-card{gap:8px}
  .cal-head{display:flex;align-items:center;justify-content:space-between}
  .cal-title{font-size:17px;font-weight:700;letter-spacing:.5px}
  .cal-nav{width:28px;height:28px;border-radius:8px;border:none;background:rgba(255,255,255,.22);color:#fff;font-size:17px;cursor:pointer;line-height:1;transition:.15s;padding:0}
  .cal-nav:hover{background:rgba(255,255,255,.4)}
  .cal-week{display:grid;grid-template-columns:repeat(7,1fr);font-size:11px;opacity:.85;text-align:center;margin-top:2px}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
  .cal-cell{height:26px;display:flex;align-items:center;justify-content:center;font-size:12.5px;border-radius:7px;position:relative}
  .cal-cell.dim{visibility:hidden}
  .cal-cell.wk{opacity:.75}
  .cal-cell.today{background:#fff;color:var(--blue);font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.15)}
  .cal-cell.trip{background:rgba(255,255,255,.28);font-weight:600}
  .cal-cell.trip::after{content:'';position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:#ffd76e}
  .cal-cell.today.trip{color:#e67e22}
  .cal-today{font-size:12px;opacity:.92;display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px}
  .cal-today .trip-legend{opacity:.95}

  /* 旅行工作台入口 */
  .trip-card{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,#e67e22,#f0932b);border-radius:14px;box-shadow:var(--shadow);padding:18px 20px;color:#fff;text-decoration:none;margin-bottom:22px;transition:transform .15s,box-shadow .15s}
  .trip-card:hover{transform:translateY(-2px);box-shadow:0 6px 22px rgba(230,126,34,.35)}
  .trip-card .t-icon{font-size:26px;flex:0 0 auto}
  .trip-card .t-body{flex:1;min-width:0}
  .trip-card .t-title{font-size:17px;font-weight:700;line-height:1.3}
  .trip-card .t-sub{font-size:12px;opacity:.9;margin-top:3px}
  .trip-card .t-arrow{font-size:24px;opacity:.85;flex:0 0 auto}

  /* 新闻板块 */
  .news{background:var(--col);border-radius:14px;box-shadow:var(--shadow);padding:20px;margin-bottom:22px}
  .news-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px}
  .news-head h2{font-size:17px;display:flex;align-items:center;gap:8px}
  .live{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--green)}
  .live .dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 1.4s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .src-tag{font-size:12px;color:var(--sub);background:#f2f4f8;padding:5px 12px;border-radius:20px}
  .tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  .tab{border:1px solid #e6e9f0;background:#fff;color:var(--sub);padding:7px 16px;border-radius:20px;cursor:pointer;font-size:13px;transition:.15s}
  .tab:hover{border-color:var(--blue);color:var(--blue)}
  .tab.active{background:var(--blue);border-color:var(--blue);color:#fff}
  .news-list{list-style:none}
  .news-item{display:flex;align-items:center;gap:12px;padding:11px 6px;border-bottom:1px solid #f0f1f5;cursor:pointer;transition:.15s}
  .news-item:last-child{border-bottom:none}
  .news-item:hover{background:#f7f9ff;padding-left:12px}
  .rank{flex:0 0 26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;background:#eef0f6;color:#9aa0b2}
  .rank.top1{background:#ffe9e6;color:var(--red)}
  .rank.top2{background:#fff3e0;color:#f09000}
  .rank.top3{background:#fff8e1;color:#d9a400}
  .news-item .title{flex:1;font-size:14px;line-height:1.4}
  .news-item .hot{font-size:12px;color:var(--sub);flex:0 0 auto}
  .news-status{padding:24px;text-align:center;color:var(--sub);font-size:13px}
  .news-status button{margin-top:10px;padding:7px 18px;border:1px solid var(--blue);background:#fff;color:var(--blue);border-radius:8px;cursor:pointer;font-size:13px}
  footer{color:var(--sub);font-size:12px;text-align:center}

  /* 离线提示条 */
  .offline-tip{font-size:12px;color:#c08a00;background:#fff8e1;padding:6px 12px;border-radius:8px;margin-bottom:12px;display:none}
</style>
</head>
<body>
  <header>
    <h1>我的主页 <span id="date"></span></h1>
    <div class="meta">由 WorkBuddy 自动部署 · GitHub Pages</div>
  </header>

  <!-- 信息条：日期 + 天气 -->
  <div class="infobar">
    <div class="info-card date cal-card">
      <div class="cal-head">
        <button class="cal-nav" id="calPrev" title="上个月">‹</button>
        <div class="cal-title" id="calTitle">加载中…</div>
        <button class="cal-nav" id="calNext" title="下个月">›</button>
      </div>
      <div class="cal-week"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>
      <div class="cal-grid" id="calGrid"></div>
      <div class="cal-today" id="calToday"></div>
    </div>
    <div class="info-card weather">
      <div class="label"><span class="icon">🌤️</span> 安徽 · 安庆 实时天气</div>
      <div class="big" id="weatherTemp">加载中…</div>
      <div class="small" id="weatherDesc"></div>
    </div>
  </div>

  <!-- 旅行工作台入口 -->
  <a class="trip-card" href="travel-planner.html">
    <span class="t-icon">🧳</span>
    <span class="t-body">
      <span class="t-title">十月旅行规划工作台</span>
      <span class="t-sub">10/5–10/25 · 喀什→重庆→丽江→南宁→广州→港澳→汕头→厦门 · 行程 / 预算 / 看板</span>
    </span>
    <span class="t-arrow">›</span>
  </a>

  <!-- 新闻板块：实时热榜（多源） -->
  <div class="news">
    <div class="news-head">
      <h2>📰 实时热榜 <span class="live"><span class="dot"></span>实时</span></h2>
      <span class="src-tag" id="srcTag">来源：知乎热榜</span>
    </div>
    <div class="tabs" id="tabs">
      <button class="tab active" data-key="zhihu">知乎</button>
      <button class="tab" data-key="weibo">微博</button>
      <button class="tab" data-key="toutiao">头条</button>
    </div>
    <div class="offline-tip" id="offlineTip">⚠️ 实时源连接失败，当前显示离线缓存（更新于 <span id="cacheTime"></span>）</div>
    <ul class="news-list" id="newsList"></ul>
    <div class="news-status" id="newsStatus">正在加载…</div>
  </div>

  <footer>
    本页含日期、安庆实时天气与实时热榜（知乎 / 微博 / 头条）· 部署于 GitHub Pages
    <div style="margin-top:6px">热榜内容来自知乎 / 微博 / 头条，版权归原作者及平台所有，本页仅作聚合展示并链接至原文。</div>
  </footer>

<script>
  // ===== 日历模块（月历 + 今日高亮 + 行程标注）=====
  (function(){
    const TRIP_START=new Date(2026,9,5), TRIP_END=new Date(2026,9,25); // 十月行程 10/5–10/25
    const grid=document.getElementById('calGrid');
    const title=document.getElementById('calTitle');
    const today=new Date();
    const view=new Date(today.getFullYear(),today.getMonth(),1);
    const WEEKS=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];

    function isToday(d){return d.getFullYear()===today.getFullYear()&&d.getMonth()===today.getMonth()&&d.getDate()===today.getDate();}
    function inTrip(d){return d>=TRIP_START&&d<=TRIP_END;}

    function render(){
      const y=view.getFullYear(),m=view.getMonth();
      title.textContent=`${y}年${m+1}月`;
      grid.innerHTML='';
      const firstDay=new Date(y,m,1).getDay();
      const days=new Date(y,m+1,0).getDate();
      for(let i=0;i<firstDay;i++){
        const c=document.createElement('div');c.className='cal-cell dim';grid.appendChild(c);
      }
      for(let d=1;d<=days;d++){
        const cur=new Date(y,m,d);
        const wd=cur.getDay();
        const c=document.createElement('div');
        c.className='cal-cell'+((wd===0||wd===6)?' wk':'');
        if(isToday(cur))c.classList.add('today');
        if(inTrip(cur))c.classList.add('trip');
        c.textContent=d;
        grid.appendChild(c);
      }
    }

    document.getElementById('calPrev').onclick=()=>{view.setMonth(view.getMonth()-1);render();};
    document.getElementById('calNext').onclick=()=>{view.setMonth(view.getMonth()+1);render();};

    document.getElementById('calToday').innerHTML=
      `<span>今天 ${today.getMonth()+1}月${today.getDate()}日 ${WEEKS[today.getDay()]}</span>`+
      `<span class="trip-legend">🧳 行程 10/5–10/25</span>`;
    document.getElementById('date').textContent=`${today.getFullYear()}/${today.getMonth()+1}/${today.getDate()}`;
    render();
  })();

  // ===== 天气模块（Open-Meteo 免费 API + 浏览器自动定位）=====
  const WMO={0:'晴',1:'大致晴朗',2:'局部多云',3:'阴',45:'雾',48:'雾凇',51:'小毛毛雨',53:'毛毛雨',55:'大毛毛雨',56:'冻毛毛雨',57:'强冻毛毛雨',61:'小雨',63:'中雨',65:'大雨',66:'冻雨',67:'强冻雨',71:'小雪',73:'中雪',75:'大雪',77:'雪粒',80:'阵雨',81:'强阵雨',82:'暴雨',85:'阵雪',86:'强阵雪',95:'雷阵雨',96:'雷阵雨伴冰雹',99:'强雷暴伴冰雹'};
  (function(){
    const DEFAULT={lat:30.51, lon:117.05, name:'安徽 · 安庆'};
    const lbl=document.querySelector('.info-card.weather .label');
    const tempEl=document.getElementById('weatherTemp');
    const descEl=document.getElementById('weatherDesc');

    function loadWeather(lat,lon,locationName){
      const url=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&timezone=auto`;
      fetch(url).then(r=>r.json()).then(d=>{
        const c=d.current||{};
        const temp=Math.round(c.temperature_2m);
        tempEl.textContent=`${temp}°C`;
        descEl.textContent=`${WMO[c.weather_code]||'未知'} · 湿度 ${c.relative_humidity_2m}% · 风速 ${c.wind_speed_10m} km/h`;
        if(locationName){
          lbl.innerHTML=`<span class="icon">📍</span> ${locationName} 实时天气`;
        }
      }).catch(()=>{
        tempEl.textContent='获取失败';
        descEl.textContent='网络受限，请检查网络后刷新';
      });
    }

    // 1) 先加载默认位置（安庆），保证秒开不空白
    loadWeather(DEFAULT.lat, DEFAULT.lon, null);

    // 2) 尝试浏览器定位，成功后自动更新为当前位置天气
    if(navigator.geolocation){
      lbl.innerHTML='<span class="icon">📍</span> 正在定位…';
      navigator.geolocation.getCurrentPosition(pos=>{
        const la=pos.coords.latitude, lo=pos.coords.longitude;
        // 逆地理编码：经纬度 → 中文城市名（BigDataCloud 免费接口，无需 key）
        fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${la}&longitude=${lo}&localityLanguage=zh`)
          .then(r=>r.json())
          .then(g=>{
            const city=g.city||g.locality||'';
            const prov=g.principalSubdivision||'';
            const name=city||(prov||'当前位置');
            loadWeather(la.toFixed(3), lo.toFixed(3), name);
          })
          .catch(()=>loadWeather(la.toFixed(3), lo.toFixed(3), '当前位置'));
      }, err=>{
        // 定位失败/被拒绝：保持默认安庆
        lbl.innerHTML=`<span class="icon">🌤️</span> 安徽 · 安庆 实时天气`;
      }, {timeout:8000, maximumAge:300000});
    }
  })();

  // ===== 新闻模块：实时热榜（多源：知乎 / 微博 / 头条）=====
  const VIKI='https://60s-api.viki.moe/v2/';
  const TIMEOUT=8000;
  const TABS={
    zhihu:{name:'知乎热榜', src:'zhihu'},
    weibo:{name:'微博热搜', src:'weibo'},
    toutiao:{name:'头条热点', src:'toutiao'}
  };
  let current='zhihu';
  const cache={};          // key -> {items, offline}
  let cacheTime='';        // 离线缓存更新时间

  function fmtHot(v){
    v=Number(v)||0;
    if(v>=1e8) return (v/1e8).toFixed(1)+'亿';
    if(v>=1e4) return (v/1e4).toFixed(1)+'万';
    return String(v);
  }

  function parseItems(key, d){
    const raw = d && d.data ? d.data : [];
    const arr = Array.isArray(raw) ? raw : (raw.data||[]);
    return arr.map(it=>{
      let url, hot;
      if(key==='zhihu'){
        url = it.link || ('https://www.zhihu.com/search?type=content&q='+encodeURIComponent(it.title||''));
        hot = it.hot_value_desc || '';
      }else{
        url = it.link || '#';
        hot = (it.hot_value!=null) ? fmtHot(it.hot_value) : '';
      }
      return {title:it.title||'', url, hot};
    }).filter(x=>x.title).slice(0,30);
  }

  function render(key, data){
    const list=document.getElementById('newsList');
    const status=document.getElementById('newsStatus');
    const tip=document.getElementById('offlineTip');
    list.innerHTML=''; status.style.display='none';
    document.getElementById('srcTag').textContent='来源：'+TABS[key].name;
    if(data.offline){
      tip.style.display='block';
      document.getElementById('cacheTime').textContent=cacheTime||'未知';
    }else{
      tip.style.display='none';
    }
    data.items.forEach((it,i)=>{
      const li=document.createElement('li');li.className='news-item';
      const rankCls=i<3?('rank top'+(i+1)):'rank';
      const hot=it.hot?('🔥 '+it.hot):'';
      li.innerHTML=`<span class="${rankCls}">${i+1}</span><span class="title">${it.title}</span><span class="hot">${hot}</span>`;
      li.onclick=()=>{ if(it.url&&it.url!=='#') window.open(it.url,'_blank'); };
      list.appendChild(li);
    });
  }

  async function loadTab(key, force){
    if(cache[key] && !force){ render(key, cache[key]); return; }
    const list=document.getElementById('newsList');
    const status=document.getElementById('newsStatus');
    const tip=document.getElementById('offlineTip');
    list.innerHTML=''; tip.style.display='none'; status.style.display='block';
    status.textContent='正在加载'+TABS[key].name+'…';
    const liveUrl=VIKI+TABS[key].src;
    let items=null, offline=false;
    // 1) 实时源
    try{
      const ctrl=new AbortController();
      const timer=setTimeout(()=>ctrl.abort(),TIMEOUT);
      const r=await fetch(liveUrl,{mode:'cors',signal:ctrl.signal});
      clearTimeout(timer);
      const d=await r.json();
      items=parseItems(key,d);
    }catch(e){ items=null; }
    // 2) 离线缓存兜底（真实数据，部署时抓取）
    if(!items || !items.length){
      try{
        const r=await fetch('news.json?t='+Date.now());
        const j=await r.json();
        items=(j[key]||[]).filter(x=>x.title).slice(0,30);
        offline=true;
      }catch(e){ items=[]; }
    }
    if(!items || !items.length){
      status.style.display='block';
      status.innerHTML='加载失败<br><button onclick="loadTab(\''+key+'\',true)">重试</button>';
      return;
    }
    cache[key]={items, offline};
    render(key, cache[key]);
  }

  // 标签切换
  document.getElementById('tabs').addEventListener('click', e=>{
    const btn=e.target.closest('.tab'); if(!btn) return;
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    btn.classList.add('active');
    current=btn.dataset.key;
    loadTab(current);
  });

  // 初始化：读取离线缓存时间 + 加载首个标签
  (async function init(){
    try{
      const r=await fetch('news.json?t='+Date.now());
      const j=await r.json();
      cacheTime=j.updated_at||'';
    }catch(e){}
    loadTab(current);
    setInterval(()=>loadTab(current, true), 5*60*1000);
  })();
</script>
</body>
</html>
