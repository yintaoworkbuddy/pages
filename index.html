<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的主页 · 日期 / 天气 / 知乎热榜</title>
<style>
  :root{
    --bg:#f5f6fa; --col:#ffffff; --txt:#1f2330; --sub:#8a90a2;
    --blue:#3d7bff; --green:#22c08a; --red:#ff5a52;
    --shadow:0 4px 18px rgba(31,35,48,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--txt); padding:28px; min-height:100vh;
  }
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:12px}
  header h1{font-size:22px;letter-spacing:.5px}
  header h1 span{color:var(--sub);font-weight:400;font-size:14px;margin-left:8px}
  .meta{color:var(--sub);font-size:13px}

  /* 信息条：日期 + 天气 */
  .infobar{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:24px}
  @media(max-width:760px){.infobar{grid-template-columns:1fr}}
  .info-card{background:linear-gradient(135deg,#3d7bff,#6aa1ff);border-radius:14px;box-shadow:var(--shadow);padding:18px 20px;color:#fff;display:flex;flex-direction:column;gap:6px}
  .info-card.weather{background:linear-gradient(135deg,#22c08a,#4fd6a6)}
  .info-card .label{font-size:13px;opacity:.85;display:flex;align-items:center;gap:6px}
  .info-card .big{font-size:26px;font-weight:700;line-height:1.2}
  .info-card .small{font-size:13px;opacity:.9}
  .info-card .icon{font-size:22px}

  /* 新闻板块 */
  .news{background:var(--col);border-radius:14px;box-shadow:var(--shadow);padding:20px;margin-bottom:22px}
  .news-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px}
  .news-head h2{font-size:17px;display:flex;align-items:center;gap:8px}
  .live{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--green)}
  .live .dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 1.4s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .src-tag{font-size:12px;color:var(--sub);background:#f2f4f8;padding:5px 12px;border-radius:20px}
  .news-list{list-style:none}
  .news-item{display:flex;align-items:center;gap:12px;padding:11px 6px;border-bottom:1px solid #f0f1f5;cursor:pointer;transition:.15s}
  .news-item:last-child{border-bottom:none}
  .news-item:hover{background:#f7f9ff;padding-left:12px}
  .rank{flex:0 0 26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;background:#eef0f6;color:#9aa0b2}
  .rank.top1{background:#ffe9e6;color:var(--red)}
  .rank.top2{background:#fff3e0;color:#f09000}
  .rank.top3{background:#fff8e1;color:#d9a400}
  .news-item .title{flex:1;font-size:14px;line-height:1.4}
  .news-item .hot{font-size:12px;color:var(--sub);flex:0 0 auto}
  .news-status{padding:24px;text-align:center;color:var(--sub);font-size:13px}
  .news-status button{margin-top:10px;padding:7px 18px;border:1px solid var(--blue);background:#fff;color:var(--blue);border-radius:8px;cursor:pointer;font-size:13px}
  footer{color:var(--sub);font-size:12px;text-align:center}

  /* 离线提示条 */
  .offline-tip{font-size:12px;color:#c08a00;background:#fff8e1;padding:6px 12px;border-radius:8px;margin-bottom:12px;display:none}
</style>
</head>
<body>
  <header>
    <h1>我的主页 <span id="date"></span></h1>
    <div class="meta">由 WorkBuddy 自动部署 · GitHub Pages</div>
  </header>

  <!-- 信息条：日期 + 天气 -->
  <div class="infobar">
    <div class="info-card date">
      <div class="label"><span class="icon">📅</span> 今日日期</div>
      <div class="big" id="dateBig">加载中…</div>
      <div class="small" id="dateSmall"></div>
    </div>
    <div class="info-card weather">
      <div class="label"><span class="icon">🌤️</span> 安徽 · 安庆 实时天气</div>
      <div class="big" id="weatherTemp">加载中…</div>
      <div class="small" id="weatherDesc"></div>
    </div>
  </div>

  <!-- 新闻板块：知乎热榜 -->
  <div class="news">
    <div class="news-head">
      <h2>📰 知乎热榜 <span class="live"><span class="dot"></span>实时</span></h2>
      <span class="src-tag">来源：知乎</span>
    </div>
    <div class="offline-tip" id="offlineTip">⚠️ 实时新闻源连接失败，当前显示离线示例数据</div>
    <ul class="news-list" id="newsList"></ul>
    <div class="news-status" id="newsStatus">正在加载知乎热榜…</div>
  </div>

  <footer>本页含日期、安庆实时天气与知乎热榜 · 部署于 GitHub Pages</footer>

<script>
  // ===== 日期模块 =====
  (function(){
    const now=new Date();
    const y=now.getFullYear(),m=now.getMonth()+1,d=now.getDate();
    const week=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][now.getDay()];
    document.getElementById('dateBig').textContent=`${y}年${m}月${d}日`;
    document.getElementById('dateSmall').textContent=`${week}`;
    document.getElementById('date').textContent=`${y}/${m}/${d}`;
  })();

  // ===== 天气模块（Open-Meteo 免费 API）=====
  const WMO={0:'晴',1:'大致晴朗',2:'局部多云',3:'阴',45:'雾',48:'雾凇',51:'小毛毛雨',53:'毛毛雨',55:'大毛毛雨',56:'冻毛毛雨',57:'强冻毛毛雨',61:'小雨',63:'中雨',65:'大雨',66:'冻雨',67:'强冻雨',71:'小雪',73:'中雪',75:'大雪',77:'雪粒',80:'阵雨',81:'强阵雨',82:'暴雨',85:'阵雪',86:'强阵雪',95:'雷阵雨',96:'雷阵雨伴冰雹',99:'强雷暴伴冰雹'};
  (function(){
    const url='https://api.open-meteo.com/v1/forecast?latitude=30.51&longitude=117.05&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&timezone=Asia/Shanghai';
    fetch(url).then(r=>r.json()).then(d=>{
      const c=d.current||{};const code=c.weather_code;const temp=Math.round(c.temperature_2m);
      document.getElementById('weatherTemp').textContent=`${temp}°C`;
      document.getElementById('weatherDesc').textContent=`${WMO[code]||'未知'} · 湿度 ${c.relative_humidity_2m}% · 风速 ${c.wind_speed_10m} km/h`;
    }).catch(()=>{
      document.getElementById('weatherTemp').textContent='获取失败';
      document.getElementById('weatherDesc').textContent='网络受限，请检查网络后刷新';
    });
  })();

  // ===== 新闻模块：知乎热榜（单一主源 + 超时 + 本地兜底）=====
  const ZHIHU_SRC='https://api.vvhan.com/api/hotlist/zhihu';
  const TIMEOUT=8000;

  function parseZhihu(d){
    let arr=d.data;
    if(arr&&!Array.isArray(arr)) arr=arr.data||arr.list||[];
    return (arr||[]).map(it=>({
      title:it.title||it.qtitle||it.word||it.name||'',
      url:it.url||it.mobileUrl||it.link||'',
      hot:it.hot||it.hotScore||it.heat||''
    })).filter(x=>x.title).slice(0,30);
  }

  function renderNews(items){
    const list=document.getElementById('newsList');list.innerHTML='';
    items.forEach((it,i)=>{
      const li=document.createElement('li');li.className='news-item';
      const rankCls=i<3?('rank top'+(i+1)):'rank';
      const hot=it.hot?('🔥 '+it.hot):'';
      li.innerHTML=`<span class="${rankCls}">${i+1}</span><span class="title">${it.title}</span><span class="hot">${hot}</span>`;
      const go=it.url||('https://www.zhihu.com/search?type=content&q='+encodeURIComponent(it.title));
      li.onclick=()=>window.open(go,'_blank');
      list.appendChild(li);
    });
  }

  async function loadNews(){
    const list=document.getElementById('newsList');
    const status=document.getElementById('newsStatus');
    const tip=document.getElementById('offlineTip');
    list.innerHTML='';status.style.display='block';status.textContent='正在加载知乎热榜…';tip.style.display='none';
    // 1) 主源：vvhan 知乎热榜
    try{
      const ctrl=new AbortController();
      const timer=setTimeout(()=>ctrl.abort(),TIMEOUT);
      const r=await fetch(ZHIHU_SRC,{mode:'cors',signal:ctrl.signal});
      clearTimeout(timer);
      const d=await r.json();
      const items=parseZhihu(d);
      if(items.length){renderNews(items);status.style.display='none';return;}
    }catch(e){/* 走兜底 */}
    // 2) 兜底：本地 news.json
    try{
      const r=await fetch('news.json?t='+Date.now());const j=await r.json();
      const items=(j.zhihu||[]).filter(x=>x.title).slice(0,30);
      if(items.length){tip.style.display='block';renderNews(items);status.style.display='none';return;}
    }catch(e){}
    status.style.display='block';
    status.innerHTML='实时新闻源连接失败<br><button onclick="loadNews()">重试</button>';
  }

  loadNews();
  setInterval(loadNews,5*60*1000);
</script>
</body>
</html>
