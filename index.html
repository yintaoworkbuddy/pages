<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的看板 · Kanban</title>
<style>
  :root{
    --bg:#f5f6fa; --col:#ffffff; --txt:#1f2330; --sub:#8a90a2;
    --todo:#ff7a59; --doing:#3d7bff; --done:#22c08a;
    --shadow:0 4px 18px rgba(31,35,48,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--txt); padding:28px; min-height:100vh;
  }
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:12px}
  header h1{font-size:22px;letter-spacing:.5px}
  header h1 span{color:var(--sub);font-weight:400;font-size:14px;margin-left:8px}
  .meta{color:var(--sub);font-size:13px}

  /* 信息条：日期 + 天气 */
  .infobar{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:24px}
  @media(max-width:760px){.infobar{grid-template-columns:1fr}}
  .info-card{background:linear-gradient(135deg,#3d7bff,#6aa1ff);border-radius:14px;box-shadow:var(--shadow);padding:18px 20px;color:#fff;display:flex;flex-direction:column;gap:6px}
  .info-card.weather{background:linear-gradient(135deg,#22c08a,#4fd6a6)}
  .info-card .label{font-size:13px;opacity:.85;display:flex;align-items:center;gap:6px}
  .info-card .big{font-size:26px;font-weight:700;line-height:1.2}
  .info-card .small{font-size:13px;opacity:.9}
  .info-card .icon{font-size:22px}

  .board{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
  @media(max-width:760px){.board{grid-template-columns:1fr}}
  .col{background:var(--col);border-radius:14px;box-shadow:var(--shadow);padding:16px;min-height:240px}
  .col h2{font-size:15px;display:flex;align-items:center;gap:8px;margin-bottom:14px}
  .dot{width:10px;height:10px;border-radius:50%}
  .todo .dot{background:var(--todo)} .doing .dot{background:var(--doing)} .done .dot{background:var(--done)}
  .count{margin-left:auto;color:var(--sub);font-size:13px;background:#eef0f6;padding:1px 9px;border-radius:20px}
  .card{background:#fbfbfd;border:1px solid #eceef3;border-radius:10px;padding:12px 13px;margin-bottom:11px;cursor:grab;transition:transform .15s,box-shadow .15s}
  .card:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(31,35,48,.10)}
  .card .t{font-size:14px;font-weight:600;margin-bottom:6px}
  .card .d{font-size:12px;color:var(--sub);margin-bottom:9px;line-height:1.5}
  .tags{display:flex;gap:6px;flex-wrap:wrap}
  .tag{font-size:11px;padding:2px 8px;border-radius:6px;background:#eef0f6;color:#5a6072}
  .tag.p{background:#fff0ec;color:#e35b39}
  .tag.b{background:#eaf1ff;color:#3d7bff}
  .tag.g{background:#e8f8f1;color:#1ba678}
  footer{margin-top:22px;color:var(--sub);font-size:12px;text-align:center}
</style>
</head>
<body>
  <header>
    <h1>项目看板 <span id="date"></span></h1>
    <div class="meta">拖动卡片可调整 · 由 WorkBuddy 自动部署</div>
  </header>

  <!-- 信息条：日期 + 天气 -->
  <div class="infobar">
    <div class="info-card date">
      <div class="label"><span class="icon">📅</span> 今日日期</div>
      <div class="big" id="dateBig">加载中…</div>
      <div class="small" id="dateSmall"></div>
    </div>
    <div class="info-card weather">
      <div class="label"><span class="icon">🌤️</span> 安徽 · 安庆 实时天气</div>
      <div class="big" id="weatherTemp">加载中…</div>
      <div class="small" id="weatherDesc"></div>
    </div>
  </div>

  <div class="board">
    <section class="col todo">
      <h2><span class="dot"></span> 待办 <span class="count" id="c1">0</span></h2>
      <div id="list1"></div>
    </section>
    <section class="col doing">
      <h2><span class="dot"></span> 进行中 <span class="count" id="c2">0</span></h2>
      <div id="list2"></div>
    </section>
    <section class="col done">
      <h2><span class="dot"></span> 已完成 <span class="count" id="c3">0</span></h2>
      <div id="list3"></div>
    </section>
  </div>
  <footer>这是一个随机生成的测试看板 · 部署于 GitHub Pages</footer>

<script>
  // ===== 日期模块 =====
  function renderDate(){
    const now=new Date();
    const y=now.getFullYear();
    const m=now.getMonth()+1;
    const d=now.getDate();
    const week=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][now.getDay()];
    document.getElementById('dateBig').textContent=`${y}年${m}月${d}日`;
    document.getElementById('dateSmall').textContent=`${week} · 农历信息已略`;
    document.getElementById('date').textContent=`${y}/${m}/${d}`;
  }
  renderDate();

  // ===== 天气模块（Open-Meteo 免费 API，无需密钥）=====
  const WMO={
    0:'晴',1:'大致晴朗',2:'局部多云',3:'阴',
    45:'雾',48:'雾凇',
    51:'小毛毛雨',53:'毛毛雨',55:'大毛毛雨',
    56:'冻毛毛雨',57:'强冻毛毛雨',
    61:'小雨',63:'中雨',65:'大雨',
    66:'冻雨',67:'强冻雨',
    71:'小雪',73:'中雪',75:'大雪',77:'雪粒',
    80:'阵雨',81:'强阵雨',82:'暴雨',
    85:'阵雪',86:'强阵雪',
    95:'雷阵雨',96:'雷阵雨伴冰雹',99:'强雷暴伴冰雹'
  };
  function renderWeather(){
    // 安庆市：约 30.51N, 117.05E
    const url='https://api.open-meteo.com/v1/forecast?latitude=30.51&longitude=117.05&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&timezone=Asia/Shanghai';
    fetch(url)
      .then(r=>r.json())
      .then(d=>{
        const c=d.current||{};
        const code=c.weather_code;
        const temp=Math.round(c.temperature_2m);
        document.getElementById('weatherTemp').textContent=`${temp}°C`;
        document.getElementById('weatherDesc').textContent=
          `${WMO[code]||'未知'} · 湿度 ${c.relative_humidity_2m}% · 风速 ${c.wind_speed_10m} km/h`;
      })
      .catch(()=>{
        document.getElementById('weatherTemp').textContent='获取失败';
        document.getElementById('weatherDesc').textContent='网络受限，请检查网络后刷新';
      });
  }
  renderWeather();
  // 每 10 分钟刷新一次天气
  setInterval(renderWeather,10*60*1000);

  // ===== 看板（随机任务池）=====
  const pool = [
    {t:"梳理需求文档",d:"与产品确认本期范围与验收标准",tag:"需求",cls:"p"},
    {t:"设计数据库表结构",d:"输出 ER 图并评审通过",tag:"后端",cls:"b"},
    {t:"搭建前端脚手架",d:"初始化项目并接入路由",tag:"前端",cls:"b"},
    {t:"接口联调",d:"打通登录与权限模块",tag:"联调",cls:"g"},
    {t:"编写单元测试",d:"核心逻辑覆盖率 > 80%",tag:"测试",cls:"g"},
    {t:"修复登录闪退",d:"定位 token 过期边界问题",tag:"Bug",cls:"p"},
    {t:"优化首页加载",d:"首屏时间压到 1.5s 内",tag:"性能",cls:"b"},
    {t:"撰写上线手册",d:"含回滚方案与值班表",tag:"文档",cls:"g"},
    {t:"埋点方案评审",d:"确认关键转化事件",tag:"数据",cls:"b"},
    {t:"灰度发布",d:"先放 5% 流量观察",tag:"运维",cls:"p"},
    {t:"用户反馈整理",d:"汇总本周 12 条建议",tag:"需求",cls:"p"},
    {t:"移动端适配",d:"完成 iPhone SE 兼容",tag:"前端",cls:"b"}
  ];
  const cols=[document.getElementById('list1'),document.getElementById('list2'),document.getElementById('list3')];
  function rnd(n){return Math.floor(Math.random()*n)}
  const shuffled=[...pool].sort(()=>Math.random()-0.5);
  const split=[4,4,4];
  let idx=0;
  split.forEach((num,ci)=>{
    for(let i=0;i<num && idx<shuffled.length;i++){
      const it=shuffled[idx++];
      const el=document.createElement('div');
      el.className='card';
      el.draggable=true;
      el.innerHTML=`<div class="t">${it.t}</div><div class="d">${it.d}</div><div class="tags"><span class="tag ${it.cls}">${it.tag}</span></div>`;
      cols[ci].appendChild(el);
    }
  });
  document.getElementById('c1').textContent=cols[0].children.length;
  document.getElementById('c2').textContent=cols[1].children.length;
  document.getElementById('c3').textContent=cols[2].children.length;

  // 简单拖拽
  let dragEl=null;
  document.querySelectorAll('.card').forEach(c=>{
    c.addEventListener('dragstart',()=>{dragEl=c;c.style.opacity=.4});
    c.addEventListener('dragend',()=>{dragEl=null;c.style.opacity=1});
  });
  cols.forEach(col=>{
    col.addEventListener('dragover',e=>e.preventDefault());
    col.addEventListener('drop',e=>{e.preventDefault();if(dragEl)col.appendChild(dragEl)});
  });
</script>
</body>
</html>
