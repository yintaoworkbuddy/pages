<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的主页 · 日期 / 天气 / 常用工具 / 旅行路线</title>
<style>
  :root{
    --bg:#f5f6fa; --col:#ffffff; --txt:#1f2330; --sub:#8a90a2;
    --blue:#3d7bff; --green:#22c08a; --red:#ff5a52;
    --shadow:0 4px 18px rgba(31,35,48,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--txt); padding:28px; min-height:100vh;
  }
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:12px}
  header h1{font-size:22px;letter-spacing:.5px}
  header h1 span{color:var(--sub);font-weight:400;font-size:14px;margin-left:8px}
  .meta{color:var(--sub);font-size:13px}

  /* 信息条：日期 + 天气 */
  .infobar{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:24px}
  @media(max-width:760px){.infobar{grid-template-columns:1fr}}
  .info-card{background:linear-gradient(135deg,#3d7bff,#6aa1ff);border-radius:14px;box-shadow:var(--shadow);padding:18px 20px;color:#fff;display:flex;flex-direction:column;gap:6px}
  .info-card.weather{background:linear-gradient(135deg,#22c08a,#4fd6a6)}
  .info-card .label{font-size:13px;opacity:.85;display:flex;align-items:center;gap:6px}
  .info-card .big{font-size:26px;font-weight:700;line-height:1.2}
  .info-card .small{font-size:13px;opacity:.9}
  .info-card .icon{font-size:22px}

  /* 日历卡 */
  .cal-card{gap:8px}
  .cal-head{display:flex;align-items:center;justify-content:space-between}
  .cal-title{font-size:17px;font-weight:700;letter-spacing:.5px}
  .cal-nav{width:28px;height:28px;border-radius:8px;border:none;background:rgba(255,255,255,.22);color:#fff;font-size:17px;cursor:pointer;line-height:1;transition:.15s;padding:0}
  .cal-nav:hover{background:rgba(255,255,255,.4)}
  .cal-week{display:grid;grid-template-columns:repeat(7,1fr);font-size:11px;opacity:.85;text-align:center;margin-top:2px}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
  .cal-cell{height:26px;display:flex;align-items:center;justify-content:center;font-size:12.5px;border-radius:7px;position:relative}
  .cal-cell.dim{visibility:hidden}
  .cal-cell.wk{opacity:.75}
  .cal-cell.today{background:#fff;color:var(--blue);font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.15)}
  .cal-cell.trip{background:rgba(255,255,255,.28);font-weight:600}
  .cal-cell.trip::after{content:'';position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:#ffd76e}
  .cal-cell.today.trip{color:#e67e22}
  .cal-today{font-size:12px;opacity:.92;display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px}
  .cal-today .trip-legend{opacity:.95}

  /* 旅行工作台入口 */
  .trip-card{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,#e67e22,#f0932b);border-radius:14px;box-shadow:var(--shadow);padding:18px 20px;color:#fff;text-decoration:none;margin-bottom:22px;transition:transform .15s,box-shadow .15s}
  .trip-card:hover{transform:translateY(-2px);box-shadow:0 6px 22px rgba(230,126,34,.35)}
  .trip-card .t-icon{font-size:26px;flex:0 0 auto}
  .trip-card .t-body{flex:1;min-width:0}
  .trip-card .t-title{font-size:17px;font-weight:700;line-height:1.3}
  .trip-card .t-sub{font-size:12px;opacity:.9;margin-top:3px}
  .trip-card .t-arrow{font-size:24px;opacity:.85;flex:0 0 auto}

  /* 工具跳转区 */
  .tools{margin-bottom:22px}
  .tools-title{font-size:17px;font-weight:600;color:var(--txt);margin-bottom:12px;display:flex;align-items:center;gap:8px}
  .tool-card{display:flex;align-items:center;gap:12px;background:var(--col);border-radius:14px;box-shadow:var(--shadow);padding:16px 18px;color:var(--txt);text-decoration:none;transition:transform .15s,box-shadow .15s;border:1px solid #eef0f6}
  .tool-card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(31,35,48,.12)}
  .tool-card .t-ico{font-size:26px;flex:0 0 auto}
  .tool-card .t-body{flex:1;min-width:0}
  .tool-card .t-name{font-size:15px;font-weight:600;line-height:1.3}
  .tool-card .t-sub{font-size:12px;color:var(--sub);margin-top:2px}
  .tool-card .t-arrow{font-size:22px;color:var(--sub);flex:0 0 auto}
  .tool-card.main{background:linear-gradient(135deg,#e67e22,#f0932b);color:#fff;border:none;margin-bottom:12px}
  .tool-card.main .t-sub{color:rgba(255,255,255,.9)}
  .tool-card.main .t-arrow{color:rgba(255,255,255,.85)}
  .tool-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:520px){.tool-row{grid-template-columns:1fr}}
  .tool-card.xhs .t-ico{color:#ff2e4d}
  .tool-card.fan .t-ico{color:#ff8c00}
  .tool-card.alt{background:linear-gradient(135deg,#2563eb,#3b82f6);color:#fff;border:none}
  .tool-card.alt .t-sub{color:rgba(255,255,255,.9)}
  .tool-card.alt .t-arrow{color:rgba(255,255,255,.85)}
  .route-badge{display:inline-block;align-self:flex-start;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;margin-bottom:6px;letter-spacing:.5px;background:rgba(255,255,255,.22);color:#fff}
  .tool-card.main .t-name{font-size:18px}
  .tool-card.alt .t-name{font-size:17px;font-weight:700}
  footer{color:var(--sub);font-size:12px;text-align:center}

  /* 离线提示条 */
  .offline-tip{font-size:12px;color:#c08a00;background:#fff8e1;padding:6px 12px;border-radius:8px;margin-bottom:12px;display:none}
</style>
</head>
<body>
  <header>
    <h1>我的主页 <span id="date"></span></h1>
    <div class="meta">由 WorkBuddy 自动部署 · GitHub Pages</div>
  </header>

  <!-- 信息条：日期 + 天气 -->
  <div class="infobar">
    <div class="info-card date cal-card">
      <div class="cal-head">
        <button class="cal-nav" id="calPrev" title="上个月">‹</button>
        <div class="cal-title" id="calTitle">加载中…</div>
        <button class="cal-nav" id="calNext" title="下个月">›</button>
      </div>
      <div class="cal-week"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>
      <div class="cal-grid" id="calGrid"></div>
      <div class="cal-today" id="calToday"></div>
    </div>
    <div class="info-card weather">
      <div class="label"><span class="icon">🌤️</span> 安徽 · 安庆 实时天气</div>
      <div class="big" id="weatherTemp">加载中…</div>
      <div class="small" id="weatherDesc"></div>
    </div>
  </div>

  <!-- 工具跳转区 -->
  <section class="tools">
    <h2 class="tools-title">🧰 常用工具</h2>
    <a class="tool-card main" href="travel-planner.html">
      <span class="t-ico">🧳</span>
      <span class="t-body">
        <span class="route-badge">✅ 主路线 · 已确定</span>
        <span class="t-name">闽粤港澳·滇渝环线</span>
        <span class="t-sub">10/5–10/19 · 9 城环线 · 行程 / 预算 / 看板</span>
      </span>
      <span class="t-arrow">›</span>
    </a>
    <div class="tool-row">
      <a class="tool-card xhs" href="https://www.xiaohongshu.com" target="_blank" rel="noopener">
        <span class="t-ico">📕</span>
        <span class="t-body">
          <span class="t-name">小红书</span>
          <span class="t-sub">攻略 · 种草</span>
        </span>
      </a>
      <a class="tool-card fan" href="https://www.16fan.com" target="_blank" rel="noopener">
        <span class="t-ico">🧭</span>
        <span class="t-body">
          <span class="t-name">十六番</span>
          <span class="t-sub">旅行 · 特价</span>
        </span>
      </a>
    </div>
  </section>

  <footer>
    本页含月历、实时天气与常用工具跳转 · 部署于 GitHub Pages
  </footer>

<script>
  // ===== 日历模块（月历 + 今日高亮 + 行程标注）=====
  (function(){
    const TRIP_START=new Date(2026,9,5), TRIP_END=new Date(2026,9,19); // 十月行程 10/5–10/19
    const grid=document.getElementById('calGrid');
    const title=document.getElementById('calTitle');
    const today=new Date();
    const view=new Date(today.getFullYear(),today.getMonth(),1);
    const WEEKS=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];

    function isToday(d){return d.getFullYear()===today.getFullYear()&&d.getMonth()===today.getMonth()&&d.getDate()===today.getDate();}
    function inTrip(d){return d>=TRIP_START&&d<=TRIP_END;}

    function render(){
      const y=view.getFullYear(),m=view.getMonth();
      title.textContent=`${y}年${m+1}月`;
      grid.innerHTML='';
      const firstDay=new Date(y,m,1).getDay();
      const days=new Date(y,m+1,0).getDate();
      for(let i=0;i<firstDay;i++){
        const c=document.createElement('div');c.className='cal-cell dim';grid.appendChild(c);
      }
      for(let d=1;d<=days;d++){
        const cur=new Date(y,m,d);
        const wd=cur.getDay();
        const c=document.createElement('div');
        c.className='cal-cell'+((wd===0||wd===6)?' wk':'');
        if(isToday(cur))c.classList.add('today');
        if(inTrip(cur))c.classList.add('trip');
        c.textContent=d;
        grid.appendChild(c);
      }
    }

    document.getElementById('calPrev').onclick=()=>{view.setMonth(view.getMonth()-1);render();};
    document.getElementById('calNext').onclick=()=>{view.setMonth(view.getMonth()+1);render();};

    document.getElementById('calToday').innerHTML=
      `<span>今天 ${today.getMonth()+1}月${today.getDate()}日 ${WEEKS[today.getDay()]}</span>`+
      `<span class="trip-legend">🧳 行程 10/5–10/19</span>`;
    document.getElementById('date').textContent=`${today.getFullYear()}/${today.getMonth()+1}/${today.getDate()}`;
    render();
  })();

  // ===== 天气模块（Open-Meteo 免费 API + 浏览器自动定位）=====
  const WMO={0:'晴',1:'大致晴朗',2:'局部多云',3:'阴',45:'雾',48:'雾凇',51:'小毛毛雨',53:'毛毛雨',55:'大毛毛雨',56:'冻毛毛雨',57:'强冻毛毛雨',61:'小雨',63:'中雨',65:'大雨',66:'冻雨',67:'强冻雨',71:'小雪',73:'中雪',75:'大雪',77:'雪粒',80:'阵雨',81:'强阵雨',82:'暴雨',85:'阵雪',86:'强阵雪',95:'雷阵雨',96:'雷阵雨伴冰雹',99:'强雷暴伴冰雹'};
  (function(){
    const DEFAULT={lat:30.51, lon:117.05, name:'安徽 · 安庆'};
    const lbl=document.querySelector('.info-card.weather .label');
    const tempEl=document.getElementById('weatherTemp');
    const descEl=document.getElementById('weatherDesc');

    function loadWeather(lat,lon,locationName){
      const url=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&timezone=auto`;
      fetch(url).then(r=>r.json()).then(d=>{
        const c=d.current||{};
        const temp=Math.round(c.temperature_2m);
        tempEl.textContent=`${temp}°C`;
        descEl.textContent=`${WMO[c.weather_code]||'未知'} · 湿度 ${c.relative_humidity_2m}% · 风速 ${c.wind_speed_10m} km/h`;
        if(locationName){
          lbl.innerHTML=`<span class="icon">📍</span> ${locationName} 实时天气`;
        }
      }).catch(()=>{
        tempEl.textContent='获取失败';
        descEl.textContent='网络受限，请检查网络后刷新';
      });
    }

    // 1) 先加载默认位置（安庆），保证秒开不空白
    loadWeather(DEFAULT.lat, DEFAULT.lon, null);

    // 2) 尝试浏览器定位，成功后自动更新为当前位置天气
    if(navigator.geolocation){
      lbl.innerHTML='<span class="icon">📍</span> 正在定位…';
      navigator.geolocation.getCurrentPosition(pos=>{
        const la=pos.coords.latitude, lo=pos.coords.longitude;
        // 逆地理编码：经纬度 → 中文城市名（BigDataCloud 免费接口，无需 key）
        fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${la}&longitude=${lo}&localityLanguage=zh`)
          .then(r=>r.json())
          .then(g=>{
            const city=g.city||g.locality||'';
            const prov=g.principalSubdivision||'';
            const name=city||(prov||'当前位置');
            loadWeather(la.toFixed(3), lo.toFixed(3), name);
          })
          .catch(()=>loadWeather(la.toFixed(3), lo.toFixed(3), '当前位置'));
      }, err=>{
        // 定位失败/被拒绝：保持默认安庆
        lbl.innerHTML=`<span class="icon">🌤️</span> 安徽 · 安庆 实时天气`;
      }, {timeout:8000, maximumAge:300000});
    }
  })();

</script>
</body>
</html>
